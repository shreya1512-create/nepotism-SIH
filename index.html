<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-Driven Scheme Matching Platform for Marginalized Entrepreneurs">
  <title>Sahāy - Scheme Matching Platform</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet JS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="root"></div>

  <!-- Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;


    // Supabase Initialization (Placeholder for actual URL and Key)
    const supabaseUrl = 'https://vqkzmandfmnlknvwtywp.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxa3ptYW5kZm1ubGtudnd0eXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjAxOTksImV4cCI6MjEwMzI5NjE5OX0.YMS_KTmPkUM1739OPiSSWHxRUPI20kr4MAYHEyhpCuk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Components
    const Navbar = ({ currentView, setView, session, onLoginClick, formData }) => {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [showEmail, setShowEmail] = useState(false);

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setView('home');
      };

      useEffect(() => {
        if (isMobileMenuOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'unset';
        }
        return () => {
          document.body.style.overflow = 'unset';
        };
      }, [isMobileMenuOpen]);

      const handleNavClick = (view) => {
        setView(view);
        setIsMobileMenuOpen(false);
      };

      return (
        <nav className="navbar" style={{ width: '100%', padding: '12px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '20px', position: 'relative' }}>
          {/* LEFT: HAMBURGER (Mobile) + LOGO */}
          <div className="nav-left" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexShrink: 0 }}>
            {/* Hamburger Button for Mobile */}
            <button className="hamburger-btn" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
              <i data-lucide="menu" style={{ width: 28, height: 28 }}></i>
            </button>

            <div className="logo" onClick={() => handleNavClick('home')} style={{ cursor: 'pointer', margin: 0, display: 'flex', alignItems: 'center', gap: '16px' }}>
              <svg width="52" height="52" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ filter: 'drop-shadow(0 6px 12px rgba(0,0,0,0.25))' }}>
                <defs>
                  <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#6366f1" />
                    <stop offset="100%" stopColor="#a855f7" />
                  </linearGradient>
                  <linearGradient id="gradBot" x1="100%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stopColor="#3b82f6" />
                    <stop offset="100%" stopColor="#10b981" />
                  </linearGradient>
                  <linearGradient id="gradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#f59e0b" />
                    <stop offset="100%" stopColor="#ef4444" />
                  </linearGradient>
                </defs>
                <path d="M 24 10 A 8 8 0 1 0 8 10 A 8 8 0 0 0 16 18 H 20 A 4 4 0 0 0 24 14 Z" fill="url(#gradTop)" opacity="0.95" />
                <path d="M 12 26 A 8 8 0 1 0 28 26 A 8 8 0 0 0 20 18 H 16 A 4 4 0 0 0 12 22 Z" fill="url(#gradBot)" opacity="0.95" />
                <path d="M 28 5 C 28 8 31 8 31 8 C 31 8 28 8 28 11 C 28 8 25 8 25 8 C 25 8 28 8 28 5 Z" fill="url(#gradSpark)" />
              </svg>
              <div className="logo-text-container" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                <span style={{ fontSize: '1.8rem', fontWeight: 800, lineHeight: '1.1', color: 'var(--text-main)', letterSpacing: '-0.5px' }}>
                  Sahāy <span style={{ fontWeight: 300, color: 'var(--text-muted)' }}>AI</span>
                </span>
                <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '1px', marginTop: '2px' }}>
                  By Team Nepotism
                </span>
              </div>
            </div>
          </div>

          {/* OVERLAY for Mobile */}
          {isMobileMenuOpen && (
            <div className="mobile-overlay" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}

          {/* CENTER: ACTION BUTTONS (Sidebar on mobile) */}
          <div className={`nav-links glass sidebar-menu ${isMobileMenuOpen ? 'open' : ''}`} style={{ display: 'flex', gap: '28px', padding: '12px 40px', borderRadius: '40px', alignItems: 'center', justifyContent: 'center', border: '1px solid #cbd5e1', boxShadow: '0 4px 15px rgba(0, 0, 0, 0.06)', whiteSpace: 'nowrap', flexShrink: 0 }}>
            <div className="mobile-sidebar-header">
              <h3>Menu</h3>
              <button className="btn-icon" onClick={() => setIsMobileMenuOpen(false)}>
                <i data-lucide="x" style={{ width: 24, height: 24 }}></i>
              </button>
            </div>
            <a className={`nav-item ${currentView === 'wizard' ? 'active' : ''}`} onClick={() => handleNavClick('wizard')}>Recommender</a>
            <a className={`nav-item ${currentView === 'schemes' ? 'active' : ''}`} onClick={() => handleNavClick('schemes')}>Schemes</a>
            <a className={`nav-item ${currentView === 'calculator' ? 'active' : ''}`} onClick={() => handleNavClick('calculator')}>Calculator</a>
            <a className={`nav-item ${currentView === 'locator' ? 'active' : ''}`} onClick={() => handleNavClick('locator')}>Partner Locator</a>
          </div>

          {/* RIGHT: LOGIN/EMAIL */}
          <div className="nav-right" style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', flexShrink: 0, gap: '12px' }}>
            {session ? (
              <div className="flex items-center gap-4">
                <div className="user-profile-menu" style={{ position: 'relative', display: 'inline-block' }}>
                  <span className="user-email" style={{ fontSize: '0.9rem', color: 'var(--text-muted)', display: 'inline-flex', alignItems: 'center', gap: '6px', whiteSpace: 'nowrap', cursor: 'pointer', padding: '6px 0' }} onClick={() => setShowEmail(!showEmail)}>
                    <i data-lucide="user" style={{ width: 16, height: 16, flexShrink: 0 }}></i>
                    <span style={{ fontWeight: session?.user?.user_metadata?.full_name ? 'bold' : 'normal', color: session?.user?.user_metadata?.full_name ? 'var(--text-main)' : 'inherit' }}>
                      {session?.user?.user_metadata?.full_name || 'My Profile'}
                    </span>
                  </span>
                  {showEmail && (
                    <div className="glass-card" style={{ position: 'absolute', top: '100%', right: '50%', transform: 'translateX(50%)', padding: '10px 16px', zIndex: 100, display: 'flex', alignItems: 'center', boxShadow: '0 8px 20px rgba(0,0,0,0.15)', border: '1px solid var(--border)', whiteSpace: 'nowrap' }}>
                      <span style={{ fontSize: '0.9rem', fontWeight: 'bold', color: 'var(--text-main)' }}>{session.user.email}</span>
                    </div>
                  )}
                </div>
                <button className="btn btn-outline" style={{ padding: '8px 16px', fontSize: '0.9rem', borderRadius: '20px' }} onClick={handleLogout}>Logout</button>
              </div>
            ) : (
              <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '0.95rem', borderRadius: '20px' }} onClick={onLoginClick}>Login</button>
            )}
          </div>
        </nav>
      );
    };

    const Home = ({ setView }) => (
      <div className="container hero">
        <h1 className="animate-fade-in stagger-2">
          Empowering Marginalized Entrepreneurs with <span className="text-gradient">AI-Driven Scheme Matching</span>
        </h1>
        <p className="animate-fade-in stagger-3">
          Sahāy bridges the gap between government initiatives and the people who need them most.
          Use our conversational AI to discover tailored financial assistance and support schemes instantly.
        </p>
        <div className="flex gap-4 animate-fade-in stagger-3 justify-center flex-wrap">
          <button className="btn btn-primary" onClick={() => setView('wizard')}>
            <i data-lucide="sparkles" style={{ width: 20, height: 20 }}></i>
            Smart Scheme Recommender
          </button>
          <button className="btn btn-outline" onClick={() => setView('calculator')}>
            <i data-lucide="calculator" style={{ width: 20, height: 20 }}></i>
            Financial Calculator
          </button>
          <button className="btn btn-outline" onClick={() => setView('locator')}>
            <i data-lucide="map-pin" style={{ width: 20, height: 20 }}></i>
            Partner Locator
          </button>
          <button className="btn btn-primary" onClick={() => setView('ai-mentor')} style={{ background: 'linear-gradient(135deg, #f59e0b, #ef4444)', boxShadow: '0 4px 15px rgba(245, 158, 11, 0.4)' }}>
            <i data-lucide="bot" style={{ width: 20, height: 20 }}></i>
            AI Business Mentor
          </button>
        </div>

        <div className="grid grid-cols-3 gap-4 mt-6 animate-fade-in" style={{ marginTop: '80px' }}>
          <div className="glass-card text-center">
            <i data-lucide="message-square" style={{ width: 32, height: 32, color: "var(--primary)", margin: "0 auto", display: "block", marginBottom: 16 }}></i>
            <h3>Conversational AI</h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Multilingual wizard that talks to you to determine eligibility without complex forms.</p>
          </div>
          <div className="glass-card text-center">
            <i data-lucide="brain-circuit" style={{ width: 32, height: 32, color: "var(--secondary)", margin: "0 auto", display: "block", marginBottom: 16 }}></i>
            <h3>Hybrid Match Engine</h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Rule-based & AI hybrid system ensuring accurate mapping to government schemes.</p>
          </div>
          <div className="glass-card text-center">
            <i data-lucide="map-pin" style={{ width: 32, height: 32, color: "var(--accent)", margin: "0 auto", display: "block", marginBottom: 16 }}></i>
            <h3>Partner Locator</h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Geo-spatial tagging to find nearby NGOs and CSCs for immediate assistance.</p>
          </div>
        </div>
      </div>
    );

    const Wizard = ({ setView, formData, setFormData, session }) => {
      const [step, setStep] = useState(1);
      const [otpSent, setOtpSent] = useState(false);
      const [otpInput, setOtpInput] = useState('');

      const sendOtp = () => {
        const phoneRegex = /^[0-9]{10}$/;
        if (formData.phone && phoneRegex.test(formData.phone)) {
          setOtpSent(true);
          alert("Demo Mode: Your OTP is 1234");
        } else {
          alert("Please enter a valid 10-digit phone number.");
        }
      };

      const verifyOtp = () => {
        if (otpInput === '1234') {
          setFormData({ ...formData, isVerified: true });
          setOtpSent(false);
        } else {
          alert("Invalid OTP! Try 1234.");
        }
      };

      const handleNext = async (e) => {
        e.preventDefault();
        if (step === 1) {
          if (!formData.isVerified) {
            alert("Please verify your phone number before proceeding.");
            return;
          }
          setStep(2);
        }
        else {
          let rawIncome = parseFloat(formData.income) || 0;
          // Auto-scale if user typed something like "10" for 10 lakhs or "105" for 1.05 crore
          if (rawIncome > 0 && rawIncome < 1000) rawIncome *= 100000;
          
          if (rawIncome > 10000000) {
            alert("Sorry, This site is not for you");
            return;
          }

          try {
            await supabase.from('user_profiles').insert([{
              name: session?.user?.user_metadata?.full_name || 'Anonymous',
              phone: formData.phone,
              age: parseInt(formData.age) || null,
              gender: formData.gender,
              category: formData.category,
              loan_type: formData.loanType,
              income: parseFloat(formData.income) || null,
              cost: parseFloat(formData.cost) || null
            }]);
          } catch (err) {
            console.error("Error saving profile", err);
          }
          setView('schemes');
        }
      };

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      return (
        <div className="container">
          <div className="wizard-container glass animate-fade-in" style={{ padding: '32px', maxWidth: '600px' }}>
            <div className="flex justify-between items-center mb-6">
              <h2 className="flex items-center gap-2 m-0" style={{ margin: 0 }}>
                <i data-lucide="file-search" style={{ color: "var(--primary)" }}></i>
                Application Form
              </h2>
              <div className="badge badge-primary">Step {step} of 2</div>
            </div>

            <form onSubmit={handleNext}>
              {step === 1 && (
                <div className="animate-fade-in">


                  <div className="input-group mt-2">
                    <label>Phone Number</label>
                    <div className="flex gap-2">
                      <div className="chat-input" style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px', padding: '0 16px' }}>
                        <span style={{ color: 'var(--text-muted)', fontWeight: 'bold' }}>+91</span>
                        <input type="tel" name="phone" style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, padding: '14px 0', fontSize: '1rem', color: 'var(--text-main)' }} value={formData.phone} onChange={handleChange} required disabled={formData.isVerified} placeholder="10-digit number" pattern="[0-9]{10}" maxLength="10" title="Please enter a valid 10-digit mobile number" />
                      </div>
                      {!formData.isVerified && !otpSent && (
                        <button type="button" className="btn btn-primary" onClick={sendOtp}>Send OTP</button>
                      )}
                      {formData.isVerified && (
                        <div className="badge badge-success flex items-center gap-1" style={{ padding: '0 16px' }}>
                          <i data-lucide="check-circle" style={{ width: 16, height: 16 }}></i> Verified
                        </div>
                      )}
                    </div>
                  </div>

                  {otpSent && !formData.isVerified && (
                    <div className="input-group mt-2 p-4 glass-card" style={{ borderColor: 'var(--primary)' }}>
                      <label style={{ color: 'var(--primary)' }}>Enter OTP (Demo: 1234)</label>
                      <div className="flex gap-2 mt-2">
                        <input type="text" className="chat-input" style={{ flex: 1 }} value={otpInput} onChange={e => setOtpInput(e.target.value)} placeholder="4-digit OTP" />
                        <button type="button" className="btn btn-outline" onClick={verifyOtp}>Verify</button>
                      </div>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-4 mt-2">
                    <div className="input-group">
                      <label>Age</label>
                      <input type="number" name="age" className="chat-input" value={formData.age} onChange={handleChange} min="0" required />
                    </div>
                    <div className="input-group">
                      <label>Gender</label>
                      <select name="gender" className="chat-input" value={formData.gender} onChange={handleChange}>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mt-2 mb-6">
                    <div className="input-group">
                      <label>Social Category</label>
                      <select name="category" className="chat-input" value={formData.category} onChange={handleChange}>
                        <option>SC</option>
                        <option>ST</option>
                        <option>OBC</option>
                        <option>General</option>
                      </select>
                    </div>
                    <div className="input-group">
                      <label>Requirement Type</label>
                      <select name="loanType" className="chat-input" value={formData.loanType} onChange={handleChange}>
                        <option>Business Loan</option>
                        <option>Education Loan</option>
                      </select>
                    </div>
                  </div>

                  <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>
                    Next Step <i data-lucide="chevron-right" style={{ width: 18, height: 18 }}></i>
                  </button>
                </div>
              )}

              {step === 2 && (
                <div className="animate-fade-in">
                  <div className="input-group mt-2">
                    <label>Annual Family Income (₹)</label>
                    <input type="number" name="income" className="chat-input" value={formData.income} onChange={handleChange} min="0" required />
                  </div>

                  <div className="input-group mt-2 mb-6">
                    <label>Estimated Project/Education Cost (₹)</label>
                    <input type="number" name="cost" className="chat-input" value={formData.cost} onChange={handleChange} min="0" required />
                  </div>

                  <div className="flex gap-4">
                    <button type="button" className="btn btn-outline" onClick={() => setStep(1)} style={{ flex: 1 }}>
                      Back
                    </button>
                    <button type="submit" className="btn btn-primary" style={{ flex: 2 }}>
                      <i data-lucide="sparkles" style={{ width: 18, height: 18 }}></i> Find Schemes
                    </button>
                  </div>
                </div>
              )}
            </form>
          </div>
        </div>
      );
    };

    const Schemes = ({ setView, formData, session }) => {
      const [allSchemes, setAllSchemes] = useState([]);
      const [eligibleSchemes, setEligibleSchemes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedScheme, setSelectedScheme] = useState(null);

      useEffect(() => {
        const fetchSchemes = async () => {
          const { data: allData, error } = await supabase.from('schemes').select('*');
          if (error) {
            console.error("Error fetching schemes:", error);
          }

          let eligibleData = [];
          if (formData.isVerified && allData) {
            eligibleData = allData.filter(scheme => {
              // Category matching
              const schemeCat = (scheme.target_category || 'ALL').toLowerCase();
              const userCat = (formData.category || '').toLowerCase();
              const categoryMatch = !userCat || schemeCat === 'all' || (userCat !== 'general' && schemeCat.includes(userCat));

              // Loan Type matching
              const schemeLoan = (scheme.loan_type || 'ALL').toLowerCase();
              const userLoan = (formData.loanType || '').toLowerCase();
              const loanTypeMatch = !userLoan || schemeLoan === 'all' || schemeLoan.includes(userLoan);

              // Smart Income Parsing
              let rawIncome = parseFloat(formData.income) || 0;
              if (rawIncome > 0 && rawIncome < 1000) rawIncome *= 100000; // Auto-correct if user typed "3" instead of "300000"
              const userIncomeLakhs = rawIncome / 100000;

              let incomeMatch = true;
              if (rawIncome > 0 && scheme.criteria) {
                const searchStr = scheme.criteria.toLowerCase();
                const incomeRegex = /income.*?(\d+(\.\d+)?)\s*(lakhs?|lacs?|l\b)/i;
                const match = searchStr.match(incomeRegex);
                if (match) {
                  const limitLakhs = parseFloat(match[1]);
                  if (userIncomeLakhs > limitLakhs) {
                    incomeMatch = false;
                  }
                }
              }

              // Smart Cost/Loan Parsing
              let rawCost = parseFloat(formData.cost) || 0;
              if (rawCost > 0 && rawCost < 1000) rawCost *= 100000; // Auto-correct if user typed "10" instead of "1000000"
              const userCostLakhs = rawCost / 100000;

              let costMatch = true;
              if (rawCost > 0 && scheme.benefits) {
                const searchStr = scheme.benefits.toLowerCase();
                let foundLimits = [];
                
                const lakhRegex = /(\d+(\.\d+)?)\s*(lakhs?|lacs?|l\b)/gi;
                let match;
                while ((match = lakhRegex.exec(searchStr)) !== null) {
                  foundLimits.push(parseFloat(match[1]));
                }
                
                const croreRegex = /(\d+(\.\d+)?)\s*(crores?|cr\b)/gi;
                while ((match = croreRegex.exec(searchStr)) !== null) {
                  foundLimits.push(parseFloat(match[1]) * 100);
                }

                if (foundLimits.length > 0) {
                  const maxLimitLakhs = Math.max(...foundLimits);
                  if (userCostLakhs > maxLimitLakhs) {
                    costMatch = false;
                  }
                }
                
                const minRegex = /from\s*₹?\s*(\d+(\.\d+)?)\s*(lakhs?|lacs?|l\b)/i;
                const minMatch = searchStr.match(minRegex);
                if (minMatch) {
                  const minLimitLakhs = parseFloat(minMatch[1]);
                  if (userCostLakhs < minLimitLakhs) {
                    costMatch = false;
                  }
                }
              }

              return categoryMatch && loanTypeMatch && incomeMatch && costMatch;
            });
          }

          setAllSchemes(allData || []);
          setEligibleSchemes(eligibleData);
          setLoading(false);
        };

        fetchSchemes();

        // Realtime subscription for govt updates
        const subscription = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'schemes' }, (payload) => {
            console.log('Real-time scheme change received:', payload);
            fetchSchemes(); // Re-fetch all schemes to ensure we have the latest UI
          })
          .subscribe();

        return () => {
          supabase.removeChannel(subscription);
        };
      }, [formData, session]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [selectedScheme, loading, allSchemes, eligibleSchemes]);

      const renderSchemeCard = (scheme, isEligible, idx) => (
        <div key={scheme.id + (isEligible ? '-el' : '-all')} className={`glass-card stagger-${(idx % 3) + 1} animate-fade-in`} style={{ position: 'relative', overflow: 'hidden' }}>
          {isEligible && (
            <div style={{
              position: 'absolute', top: 0, right: 0,
              background: 'linear-gradient(135deg, var(--success), #059669)',
              color: 'white', padding: '4px 12px',
              borderBottomLeftRadius: '12px', fontWeight: 'bold', fontSize: '0.8rem'
            }}>
              Eligible
            </div>
          )}
          <h3 className="mt-2">{scheme.name}</h3>
          <p className="mb-4 mt-2" style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>{scheme.description}</p>
          <div className="flex gap-2 mb-4 flex-wrap">
            {scheme.tags && scheme.tags.map(tag => (
              <span key={tag} className="badge badge-primary">{tag}</span>
            ))}
          </div>
          <button className="btn btn-outline" style={{ width: '100%' }} onClick={() => setSelectedScheme(scheme)}>
            View Details & Apply <i data-lucide="chevron-right" style={{ width: 16, height: 16 }}></i>
          </button>
        </div>
      );

      if (loading) {
        return <div className="container text-center mt-6">Loading schemes...</div>;
      }

      return (
        <>
          <div className="container animate-fade-in" style={{ paddingTop: '40px', maxWidth: '1200px' }}>
            <div className="flex justify-between items-center mb-6">
              <div>
                <button className="btn btn-outline mb-4" onClick={() => setView('wizard')} style={{ padding: '6px 12px', fontSize: '0.85rem' }}>
                  &larr; Back to Profile
                </button>

    const LoanCalculator = () => {
      const [amount, setAmount] = useState(100000);
      const [rate, setRate] = useState(6.5); // Concessional rate
      const [tenure, setTenure] = useState(60); // Months
      const [emi, setEmi] = useState(0);

      useEffect(() => {
        // EMI Formula: E = P x R x (1+R)^N / [(1+R)^N-1]
        const p = parseFloat(amount);
        const r = parseFloat(rate) / 12 / 100;
        const n = parseFloat(tenure);

        if (p && r && n) {
          const e = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
          setEmi(e.toFixed(2));
        } else {
          setEmi(0);
        }
      }, [amount, rate, tenure]);

      return (
        <div className="container animate-fade-in" style={{ paddingTop: '40px', maxWidth: '800px' }}>
          <h2 className="flex items-center gap-2 m-0" style={{ marginBottom: '12px' }}>

            Financial Calculator

            <div>
              <div className="input-group">
                <label>Loan Amount (₹)</label>
                <input type="number" className="chat-input" value={amount} onChange={e => setAmount(e.target.value)} />
              </div>
              <div className="input-group">
                <label>Interest Rate (%) - *Concessional*</label>
                <input type="number" step="0.1" className="chat-input" value={rate} onChange={e => setRate(e.target.value)} />
              </div>
              <div className="input-group">
                <label>Tenure (Months)</label>
                <input type="number" className="chat-input" value={tenure} onChange={e => setTenure(e.target.value)} />
              </div>
            </div>

            <div className="glass flex flex-col justify-center items-center" style={{ padding: '24px', borderRadius: '12px', background: 'rgba(99, 102, 241, 0.1)' }}>
              <h3 style={{ color: 'var(--text-muted)', marginBottom: '8px' }}>Estimated Monthly EMI</h3>
              <h1 className="text-gradient" style={{ fontSize: '3rem' }}>₹{emi}</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '16px' }}>Total Amount Payable: ₹{(emi * tenure).toFixed(2)}</p>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Total Interest: ₹{((emi * tenure) - amount).toFixed(2)}</p>
            </div>
          </div>
        </div>
      );
    };

    const calculateDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 0.5 - Math.cos(dLat) / 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * (1 - Math.cos(dLon)) / 2;
      return R * 2 * Math.asin(Math.sqrt(a));
    };

    const LeafletMap = ({ userLoc, partners }) => {
      const mapRef = useRef(null);

      useEffect(() => {
        if (!window.L || !mapRef.current || !userLoc) return;

        // Clear previous map if exists
        if (mapRef.current._leaflet_id) {
          mapRef.current.innerHTML = "";
          mapRef.current._leaflet_id = null;
        }

        const map = window.L.map(mapRef.current).setView([userLoc.lat, userLoc.lng], 5);

        // Google Maps Tile Layer
        window.L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // User Marker
        const userIcon = window.L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });
        window.L.marker([userLoc.lat, userLoc.lng], { icon: userIcon }).addTo(map)
          .bindPopup("<b>Your Location</b>").openPopup();

        // Partner Markers
        const partnerIcon = window.L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        partners.forEach(p => {
          if (p.lat && p.lng) {
            window.L.marker([p.lat, p.lng], { icon: partnerIcon }).addTo(map)
              .bindPopup(`<b>${p.name}</b><br/>${p.distance} away<br/>${p.type}`);
          }
        });

        if (partners.length > 0) {
          const bounds = window.L.latLngBounds([userLoc.lat, userLoc.lng]);
          partners.forEach(p => {
            if (p.lat && p.lng) bounds.extend([p.lat, p.lng]);
          });
          map.fitBounds(bounds, { padding: [50, 50] });
        }

        return () => map.remove();
      }, [userLoc, partners]);

      return <div ref={mapRef} style={{ width: '100%', height: '100%' }} />;
    };

    const PartnerLocator = () => {
      const [allPartners, setAllPartners] = useState([]);
      const [displayedPartners, setDisplayedPartners] = useState([]);

      }, []);

      const handleLocate = () => {
        setLocating(true);
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(async (position) => {
            const { latitude, longitude } = position.coords;
            setUserLoc({ lat: latitude, lng: longitude });

            let stateName = "Regional";
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
              const data = await res.json();
              if (data && data.address && data.address.state) {
                stateName = data.address.state;
              } else if (data && data.address && data.address.city) {
                stateName = data.address.city;
              }
            } catch (e) {
              console.error("Reverse geocoding failed", e);
            }

            // Try to fetch REAL nearby locations using Overpass API
            let realPartners = [];
            try {
              const overpassQuery = `[out:json][timeout:15];
(
  nwr["amenity"="bank"](around:8000,${latitude},${longitude});
  nwr["office"="ngo"](around:15000,${latitude},${longitude});
  nwr["office"="government"](around:15000,${latitude},${longitude});
);
out center 15;`;

              const res = await fetch("https://overpass-api.de/api/interpreter", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "data=" + encodeURIComponent(overpassQuery)
              });

              if (res.ok) {
                const data = await res.json();
                if (data && data.elements && data.elements.length > 0) {
                  realPartners = data.elements
                    .filter(el => el.tags && el.tags.name)
                    .map(el => {
                      let type = 'Bank/Financial Institution';
                      if (el.tags.office === 'ngo') type = 'NGO / Partner Agency';
                      if (el.tags.office === 'government') type = 'Government / SCA Office';

                      const lat = el.lat || (el.center && el.center.lat);
                      const lng = el.lon || (el.center && el.center.lon);

                      return {
                        name: el.tags.name,
                        type: type,
                        status: 'Optimal',
                        lat: lat,
                        lng: lng,
                        distance: calculateDistance(latitude, longitude, lat, lng).toFixed(1) + ' km'
                      };
                    }).filter(p => p.lat && p.lng).sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance)).slice(0, 6);
                }
              }
            } catch (e) {
              console.error("Overpass API failed:", e);
            }

            // Fallback 1: Try Nominatim Search API if Overpass returned 0
            if (realPartners.length === 0) {
              try {
                const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=bank&lat=${latitude}&lon=${longitude}&limit=5`);
                if (nomRes.ok) {
                  const nomData = await nomRes.json();
                  if (nomData && nomData.length > 0) {
                    realPartners = nomData.map(place => ({
                      name: place.name || place.display_name.split(',')[0],
                      type: 'Bank/Financial Institution',
                      status: 'Optimal',
                      lat: parseFloat(place.lat),
                      lng: parseFloat(place.lon),
                      distance: calculateDistance(latitude, longitude, parseFloat(place.lat), parseFloat(place.lon)).toFixed(1) + ' km'
                    })).sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
                  }
                }
              } catch (e) {
                console.error("Nominatim Search API failed:", e);
              }
            }

            setLocating(false);

            if (realPartners.length > 0) {
              setDisplayedPartners(realPartners);
            } else {
              // Fallback 2: Contextual simulated local branches
              const dynamicPartners = [
                {
                  name: `${stateName} Scheduled Castes Finance and Development Corporation (Local Branch)`,
                  type: 'SCA',
                  status: 'Optimal'
                },
                {
                  name: `State Bank of India (${stateName} Main Branch)`,
                  type: 'Bank',
                  status: 'Optimal'
                },
                {
                  name: `Dalit Indian Chamber of Commerce & Industry (DICCI) - ${stateName} Chapter`,
                  type: 'NGO/SCA',
                  status: 'Optimal'
                }
              ];

              const updated = dynamicPartners.map((p, index) => {
                const pseudoLat = (Math.sin(index * 12.9898 + 1) * 43758.5453 % 1);
                const pseudoLng = (Math.cos(index * 78.233 + 1) * 43758.5453 % 1);
                const simulatedLat = latitude + (pseudoLat - 0.5) * 0.08;
                const simulatedLng = longitude + (pseudoLng - 0.5) * 0.08;

                return {
                  ...p,
                  lat: simulatedLat,
                  lng: simulatedLng,
                  distance: calculateDistance(latitude, longitude, simulatedLat, simulatedLng).toFixed(1) + ' km'
                };
              }).sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));

              setDisplayedPartners(updated);
            }
          }, (err) => {
            console.error(err);
            alert("Location access denied or failed. Please allow location access.");
            setLocating(false);
          });
        } else {
          alert("Geolocation is not supported by your browser.");
          setLocating(false);
        }
      };

      return (
        <div className="container animate-fade-in" style={{ paddingTop: '40px' }}>

                Geo-Spatial Partner Locator
              </h2>
              <p style={{ color: 'var(--text-muted)' }}>Identify the nearest eligible Channel Partner (SCA/Bank/NBFC-MFI) to route your application.</p>
            </div>
            <button className="btn btn-primary" onClick={handleLocate} disabled={locating}>
              <i data-lucide="navigation" style={{ width: 18, height: 18 }}></i> {locating ? 'Locating...' : 'Locate Me'}
            </button>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div className="glass-card" style={{ minHeight: '400px', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0, overflow: 'hidden' }}>

                  <p style={{ color: 'var(--text-muted)' }}>Click "Locate Me" to view the live interactive map.</p>
                </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {displayedPartners.map((p, idx) => (
                <div key={idx} className={`glass-card stagger-${idx + 1} animate-fade-in`} style={{ padding: '16px' }}>

                  if (textToSearch.includes(kw)) score += 2;

              ))}
              {isLoading && (
                <div style={{ alignSelf: 'flex-start', color: '#f59e0b', padding: '12px' }}>
                  <span style={{ animation: 'blink 1s infinite' }}>Assistant is typing...</span>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            <div style={{ padding: '16px', borderTop: '1px solid var(--border)', display: 'flex', gap: '12px' }}>
              <input
                type="text"
                className="chat-input"
                style={{ flex: 1, margin: 0 }}
                placeholder="Ask about scheme criteria, business ideas..."
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                disabled={isLoading}
              />
              <button className="btn btn-primary" onClick={handleSend} disabled={isLoading}>
                <i data-lucide="send" style={{ width: 18, height: 18 }}></i>
              </button>
            </div>
          </div>
        </div>
      );
    };

    const AuthModal = ({ onClose, onLoginSuccess }) => {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [name, setName] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');

      const [isForgotPassword, setIsForgotPassword] = useState(false);

      const handleAuth = async () => {
        setLoading(true);
        setError('');
        setMessage('');

        if (isForgotPassword) {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin,
          });
          if (error) {
            setError(error.message);
          } else {
            setMessage('Password reset link sent! Please check your email.');
          }
        } else if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
          });
          if (error) {
            setError(error.message);
          } else {
            setMessage('Sign up successful! Please check your email to verify your account if required.');
            if (data.session) onLoginSuccess(data.session);
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            setError(error.message);
          } else {
            onLoginSuccess(data.session);
          }
        }
        setLoading(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '400px', textAlign: 'center' }}>
            <button className="modal-close" onClick={onClose}>
              <i data-lucide="x" style={{ width: 24, height: 24 }}></i>
            </button>
            <h2 style={{ marginBottom: '16px' }}>
              {isForgotPassword ? 'Reset Password' : (isSignUp ? 'Create an Account' : 'Login to Sahāy')}
            </h2>
            <i data-lucide="shield-check" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px', display: 'block' }}></i>

            {error && <div style={{ color: '#ef4444', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}
            {message && <div style={{ color: 'var(--success)', marginBottom: '16px', fontSize: '0.9rem' }}>{message}</div>}

            <div>
              <p style={{ color: 'var(--text-muted)', marginBottom: '16px' }}>
                {isForgotPassword
                  ? 'Enter your email and we will send you a reset link.'
                  : (isSignUp ? 'Enter your email and password to register.' : 'Enter your email and password to access personalized features.')}
              </p>

              {isSignUp && (
                <input type="text" className="chat-input" placeholder="Full Name" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%', marginBottom: '12px' }} />
              )}
              <input type="email" className="chat-input" placeholder="Email address" value={email} onChange={e => setEmail(e.target.value)} style={{ width: '100%', marginBottom: '12px' }} />

              {!isForgotPassword && (
                <input type="password" className="chat-input" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', marginBottom: '8px' }} />
              )}

              {!isForgotPassword && !isSignUp && (
                <div style={{ textAlign: 'right', marginBottom: '16px' }}>
                  <span style={{ fontSize: '0.85rem', color: 'var(--primary)', cursor: 'pointer' }} onClick={() => { setIsForgotPassword(true); setError(''); setMessage(''); }}>
                    Forgot Password?
                  </span>
                </div>
              )}

              {isSignUp && <div style={{ marginBottom: '16px' }}></div>}

              <button className="btn btn-primary" style={{ width: '100%', marginBottom: '16px' }} onClick={handleAuth} disabled={loading || !email || (!isForgotPassword && !password) || (isSignUp && !name)}>
                {loading ? 'Processing...' : (isForgotPassword ? 'Send Reset Link' : (isSignUp ? 'Sign Up' : 'Log In'))}
              </button>

              <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>
                {isForgotPassword ? (
                  <span style={{ color: 'var(--primary)', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => { setIsForgotPassword(false); setError(''); setMessage(''); }}>
                    Back to Login
                  </span>
                ) : (
                  <>
                    {isSignUp ? 'Already have an account? ' : "Don't have an account? "}
                    <span style={{ color: 'var(--primary)', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => { setIsSignUp(!isSignUp); setError(''); setMessage(''); }}>
                      {isSignUp ? 'Log In' : 'Sign Up'}
                    </span>
                  </>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MouseTrail = () => {
      useEffect(() => {
        const container = document.createElement('div');
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '100vw';
        container.style.height = '100vh';
        container.style.pointerEvents = 'none';
        container.style.zIndex = '99999';
        container.style.overflow = 'hidden';
        document.body.appendChild(container);

        let lastTime = 0;
        let lastX = null;
        let lastY = null;

        const createBubble = (x, y) => {
          const now = Date.now();
          if (now - lastTime < 30) return;
          lastTime = now;

          // Calculate movement direction
          if (lastX === null) { lastX = x; lastY = y; }
          const dx = x - lastX;
          const dy = y - lastY;
          lastX = x;
          lastY = y;

          // If no movement, don't generate a direction
          if (dx === 0 && dy === 0) return;

          const spark = document.createElement('div');
          const size = Math.random() * 4 + 2;

          spark.style.position = 'absolute';
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;
          spark.style.width = `${size}px`;
          spark.style.height = `${size}px`;
          spark.style.borderRadius = '50%';

          const colors = ['#3b82f6', '#60a5fa', '#93c5fd', '#818cf8'];
          spark.style.background = colors[Math.floor(Math.random() * colors.length)];
          spark.style.boxShadow = `0 0 6px ${spark.style.background}`;

          // Calculate trajectory based on mouse movement with a slight natural spread (+/- 25 degrees)
          const baseAngle = Math.atan2(dy, dx);
          const spread = (Math.random() - 0.5) * (Math.PI / 2); // 90 degree total spread cone
          const angle = baseAngle + spread;
          const distance = Math.random() * 60 + 20;
          const rotation = angle * (180 / Math.PI);

          spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(0px) scale(1)`;
          spark.style.transition = 'all 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          spark.style.opacity = '1';

          container.appendChild(spark);

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(${distance}px) scale(0)`;
              spark.style.opacity = '0';
            });
          });

          setTimeout(() => {
            if (container.contains(spark)) container.removeChild(spark);
          }, 1000);
        };

        const handleMouseMove = (e) => createBubble(e.clientX, e.clientY);
        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            createBubble(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('touchmove', handleTouchMove);
          if (document.body.contains(container)) document.body.removeChild(container);
        };
      }, []);

      return null;
    };

    const App = () => {
      const [currentView, setView] = useState('home');
      const [session, setSession] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        isVerified: false,
        age: '',
        gender: 'Male',
        category: 'SC',
        loanType: 'Business Loan',
        income: '',
        cost: ''
      });

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });

        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentView, formData, showAuthModal, session]);

      const handleProtectedView = (viewName) => {
        if (!session && viewName !== 'home') {
          setShowAuthModal(true);
        } else {
          setView(viewName);
        }
      };

      return (
        <>
          <MouseTrail />
          <Navbar currentView={currentView} setView={handleProtectedView} session={session} onLoginClick={() => setShowAuthModal(true)} formData={formData} />
          <main>
            {currentView === 'home' && <Home setView={handleProtectedView} />}
            {currentView === 'wizard' && <Wizard setView={handleProtectedView} formData={formData} setFormData={setFormData} session={session} />}
            {currentView === 'schemes' && <Schemes setView={handleProtectedView} formData={formData} session={session} />}
            {currentView === 'calculator' && <LoanCalculator />}
            {currentView === 'locator' && <PartnerLocator />}
            {currentView === 'ai-mentor' && <AiMentor setView={handleProtectedView} />}
          </main>

          {showAuthModal && (
            <AuthModal
              onClose={() => setShowAuthModal(false)}
              onLoginSuccess={(session) => {
                setShowAuthModal(false);
              }}
            />
          )}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>

</html>
