          document.documentElement.style.overflow = 'unset';

          document.documentElement.style.overflow = 'unset';

                  <AppIcon name="mail" size={16} /> Contact
                </a>

      const [message, setMessage] = useState('');
      const [loading, setLoading] = useState(false);
      const [statusMessage, setStatusMessage] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setStatusMessage('');

        try {
          const { error } = await supabase.from('contact_messages').insert([
            { full_name: fullName, email: email, message: message }
          ]);

          if (error) {
            console.error('Error submitting contact message:', error);
            setStatusMessage('Failed to send message. Please try again.');
          } else {
            setStatusMessage('Thank you! Your message has been sent successfully.');
            setFullName('');
            setEmail('');
            setMessage('');
          }

          console.error('Unexpected error:', err);
          setStatusMessage('An unexpected error occurred. Please try again.');
        } finally {
          setLoading(false);
        }

        <section id="contact" style={{ background: 'var(--bg-card)', padding: '100px 16px', borderTop: 'var(--glass-border)' }}>

              <p style={{ color: 'var(--text-muted)', fontSize: '1.1rem' }}>

            </div>

            <div className="glass-card" style={{ padding: '40px' }}>

                    className="chat-input"
                    placeholder="Enter your full name"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    required
                  />
                </div>

                <div className="input-group">
                  <label style={{ fontSize: '0.95rem', fontWeight: '600', marginBottom: '8px', color: 'var(--text-main)' }}>Email Address</label>
                  <input
                    type="email"
                    className="chat-input"
                    placeholder="name@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                  />
                </div>

                <div className="input-group">
                  <label style={{ fontSize: '0.95rem', fontWeight: '600', marginBottom: '8px', color: 'var(--text-main)' }}>Message</label>
                  <textarea

    const Schemes = ({ setView, formData, session, vaultSchemes = [] }) => {
      const [allSchemes, setAllSchemes] = useState(() => (vaultSchemes && vaultSchemes.length > 0 ? vaultSchemes : []));
      const [eligibleSchemes, setEligibleSchemes] = useState([]);
      const [loading, setLoading] = useState(() => !(vaultSchemes && vaultSchemes.length > 0));
      const [selectedScheme, setSelectedScheme] = useState(null);

      useEffect(() => {
        const fetchSchemes = async () => {
          const { data: allData, error } = await supabase.from('nsfdc_schemes').select('*');
          if (error) {
            console.error("Error fetching schemes:", error);
          }

          let eligibleData = [];
          if (formData.isVerified && allData) {
            eligibleData = allData.filter(scheme => {
              // Category matching
              const schemeCat = (scheme.category || 'ALL').toLowerCase();
              const userCat = (formData.category || '').toLowerCase();
              const userGender = (formData.gender || '').toLowerCase();

              let categoryMatch = false;
              if (schemeCat === 'all') {
                categoryMatch = true;
              } else if (schemeCat === userCat) {
                categoryMatch = true;
              } else if (schemeCat === userCat + ' female') {
                categoryMatch = (userGender === 'female');
              }

              // Smart Income & Cost Parsing
              let rawIncome = parseFloat(formData.income) || 0;
              if (rawIncome > 0 && rawIncome < 1000) rawIncome *= 100000;

              let incomeMatch = true;
              if (scheme.max_family_income && rawIncome > scheme.max_family_income) {
                incomeMatch = false;
              }

              let rawCost = parseFloat(formData.cost) || 0;
              if (rawCost > 0 && rawCost < 1000) rawCost *= 100000;

              let costMatch = true;
              if (scheme.max_project_cost && rawCost > scheme.max_project_cost) {
                costMatch = false;
              }
              if (scheme.min_project_cost && rawCost < scheme.min_project_cost) {
                costMatch = false;
              }

              // Age Matching
              const userAge = parseInt(formData.age) || 0;
              let ageMatch = true;
              if (scheme.min_age && userAge < scheme.min_age) ageMatch = false;
              if (scheme.max_age && userAge > scheme.max_age) ageMatch = false;

              // Loan Type Matching
              let loanTypeMatch = true;
              const userLoan = (formData.loanType || '').toLowerCase();
              const schemeLoan = (scheme.loan_type || '').toLowerCase();
              if (schemeLoan && userLoan && schemeLoan !== userLoan) {
                loanTypeMatch = false;
              }

              return categoryMatch && incomeMatch && costMatch && ageMatch && loanTypeMatch;
            });
          }

          setAllSchemes(allData || []);
          setEligibleSchemes(eligibleData);
          setLoading(false);
        };

        fetchSchemes();

        // Realtime subscription for govt updates
        const subscription = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'nsfdc_schemes' }, (payload) => {
            console.log('Real-time scheme change received:', payload);
            fetchSchemes(); // Re-fetch all schemes to ensure we have the latest UI
          })
          .subscribe();

        return () => {
          supabase.removeChannel(subscription);
        };

    const LoanCalculator = () => {
      const [amount, setAmount] = useState(100000);
      const [rate, setRate] = useState(6.5); // Concessional rate
      const [tenure, setTenure] = useState(60); // Months
      const [emi, setEmi] = useState(0);

      useEffect(() => {
        // EMI Formula: E = P x R x (1+R)^N / [(1+R)^N-1]
        const p = parseFloat(amount);
        const r = parseFloat(rate) / 12 / 100;
        const n = parseFloat(tenure);

        if (p && r && n) {
          const e = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
          setEmi(e.toFixed(2));
        } else {
          setEmi(0);
        }
      }, [amount, rate, tenure]);

      return (
        <div className="container animate-fade-in" style={{ paddingTop: '40px', maxWidth: '800px' }}>
          <h2 className="flex items-center gap-2 m-0" style={{ marginBottom: '12px' }}>
            <AppIcon name="calculator" size={24} style={{ color: "var(--secondary)" }} />
            Financial Calculator

          <p style={{ color: 'var(--text-muted)', marginBottom: '32px' }}>Calculate projected EMIs accounting for specific scheme guidelines (e.g. concessional rates 6.5% - 8%).</p>

          <div className="glass-card grid grid-cols-2 gap-4">
            <div>
              <div className="input-group">
                <label>Loan Amount (₹)</label>
                <input type="number" className="chat-input" value={amount} onChange={e => setAmount(e.target.value)} />
              </div>
              <div className="input-group">
                <label>Interest Rate (%) - *Concessional*</label>
                <input type="number" step="0.1" className="chat-input" value={rate} onChange={e => setRate(e.target.value)} />
              </div>
              <div className="input-group">
                <label>Tenure (Months)</label>
                <input type="number" className="chat-input" value={tenure} onChange={e => setTenure(e.target.value)} />
              </div>
            </div>

            <div className="glass flex flex-col justify-center items-center" style={{ padding: '24px', borderRadius: '12px', background: 'rgba(99, 102, 241, 0.1)' }}>
              <h3 style={{ color: 'var(--text-muted)', marginBottom: '8px' }}>Estimated Monthly EMI</h3>
              <h1 className="text-gradient" style={{ fontSize: '3rem' }}>₹{emi}</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '16px' }}>Total Amount Payable: ₹{(emi * tenure).toFixed(2)}</p>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Total Interest: ₹{((emi * tenure) - amount).toFixed(2)}</p>
            </div>
          </div>
        </div>
      );
    };

    const calculateDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 0.5 - Math.cos(dLat) / 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * (1 - Math.cos(dLon)) / 2;
      return R * 2 * Math.asin(Math.sqrt(a));
    };

    const LeafletMap = ({ userLoc, partners }) => {

      useEffect(() => {
        if (!window.L || !mapRef.current || !userLoc) return;

        // Clear previous map if exists
        if (mapRef.current._leaflet_id) {
          mapRef.current.innerHTML = "";
          mapRef.current._leaflet_id = null;
        }

        const map = window.L.map(mapRef.current).setView([userLoc.lat, userLoc.lng], 5);

        // OpenStreetMap Tile Layer
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: ', OpenStreetMap contributors'
        }).addTo(map);

        // User Marker
        const userIcon = window.L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });
        window.L.marker([userLoc.lat, userLoc.lng], { icon: userIcon }).addTo(map)
          .bindPopup("<b>Your Location</b>").openPopup();

        // Partner Markers
        const partnerIcon = window.L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        partners.forEach(p => {
          if (p.lat && p.lng) {
            const popupHtml = `
              <div style="font-family: inherit;">
                <strong>${p.name}</strong><br/>
                <small style="color: #666;">${p.type} • ${p.distance} away</small><br/>
                <hr style="margin: 6px 0; border: 0; border-top: 1px solid #ddd;" />
                <small>${p.contact_number}</small><br/>
                <strong style="color: #059669;">Funds: ₹${p.available_disbursement_limit ? (p.available_disbursement_limit / 10000000).toFixed(2) : 0} Cr</strong>
              </div>
            `;
            window.L.marker([p.lat, p.lng], { icon: partnerIcon }).addTo(map)
              .bindPopup(popupHtml);
          }
        });

        if (partners.length > 0) {
          const bounds = window.L.latLngBounds([userLoc.lat, userLoc.lng]);
          partners.forEach(p => {
            if (p.lat && p.lng) bounds.extend([p.lat, p.lng]);
          });
          map.fitBounds(bounds, { padding: [50, 50] });
        }

        return () => map.remove();
      }, [userLoc, partners]);

      return <div ref={mapRef} style={{ width: '100%', minHeight: '350px', height: '100%', zIndex: 0 }} />;
    };

    const PartnerLocator = () => {
      const [allPartners, setAllPartners] = useState([]);
      const [displayedPartners, setDisplayedPartners] = useState([]);
      const [userLoc, setUserLoc] = useState(null);
      const [locating, setLocating] = useState(false);
      const [locatingMessage, setLocatingMessage] = useState("");

      useEffect(() => {
        supabase.from('channel_partners').select('*').then(({ data }) => setAllPartners(data || []));
      }, []);

      const handleLocate = () => {
        setLocating(true);
        setLocatingMessage("Acquiring GPS coordinates...");

        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(async (position) => {
            let { latitude, longitude } = position.coords;

            // Constrain demo to West Bengal (as data is WB-only)
            const isInsideWB = latitude >= 21.0 && latitude <= 27.5 && longitude >= 85.5 && longitude <= 90.0;
            if (!isInsideWB) {
              latitude = 22.5726; // Default to Kolkata
              longitude = 88.3639;
            }
            setUserLoc({ lat: latitude, lng: longitude });

            let currentRadius = 20;
            const maxRadius = 100;
            let foundPartners = [];

            while (currentRadius <= maxRadius && foundPartners.length === 0) {
              setLocatingMessage(`Scanning ${currentRadius}km radius...`);
              await new Promise(resolve => setTimeout(resolve, 800)); // UI animation delay

              const calculatedPartners = allPartners.map(p => {
                const distance = calculateDistance(latitude, longitude, p.latitude, p.longitude);
                return {
                  name: p.partner_name,
                  type: p.partner_type,
                  status: p.is_fund_eligible ? 'Optimal' : 'Depleted',
                  lat: p.latitude,
                  lng: p.longitude,
                  distance: distance.toFixed(1) + ' km',
                  rawDistance: distance,
                  address: p.address,
                  district: p.district,
                  state: p.state,
                  pincode: p.pincode,
                  contact_number: p.contact_number,
                  email: p.email,
                  supported_scheme_categories: p.supported_scheme_categories,
                  npa_percentage: p.npa_percentage,
                  available_disbursement_limit: p.available_disbursement_limit,
                  is_fund_eligible: p.is_fund_eligible
                };
              });

              foundPartners = calculatedPartners
                .filter(p => p.rawDistance <= currentRadius)
                .sort((a, b) => a.rawDistance - b.rawDistance);

              if (foundPartners.length > 0) {
                break;
              }

              if (currentRadius < maxRadius) {
                setLocatingMessage(`No partners found. Expanding search to ${currentRadius + 20}km...`);
                await new Promise(resolve => setTimeout(resolve, 1000));
                currentRadius += 20;
              } else {
                break;
              }
            }

            if (foundPartners.length > 0) {
              setLocatingMessage("Found nearest partners!");
            } else {
              setLocatingMessage("No partners found within 100km.");
            }
            await new Promise(resolve => setTimeout(resolve, 800));

            setLocating(false);
            setLocatingMessage("");

            setDisplayedPartners(foundPartners.slice(0, 6)); // Show top 6 closest
          }, (err) => {
            console.error(err);
            alert("Location access denied or failed. Please allow location access.");
            setLocating(false);
            setLocatingMessage("");
          });
        } else {
          alert("Geolocation is not supported by your browser.");
          setLocating(false);
          setLocatingMessage("");
        }
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [displayedPartners, locatingMessage]);

      return (
        <div className="container animate-fade-in" style={{ paddingTop: '40px' }}>

                    <i data-lucide="loader" className="spin" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px', display: 'block' }}></i>

                    <p style={{ color: 'var(--text-muted)' }}>Click "Locate Me" to view the live interactive map.</p>
                  </div>

              </div>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.8rem', textAlign: 'center', margin: '4px 0' }}>

                Note: GPS pins are approximate approximations. Use the "Navigate to Branch" option for precise turn-by-turn routing.
              </p>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {displayedPartners.map((p, idx) => (

                      <p style={{ margin: '2px 0 0 0', color: 'var(--text-muted)' }}>{p.contact_number}<br />{p.email}</p>
                    </div>

                    <div className="flex flex-wrap gap-2">

                  <a

                    <i data-lucide="navigation" style={{ width: 16, height: 16 }}></i> Navigate to Branch

          'right', 'rs', 'rupee', 'rupees', 'same', 'say', 'scheme', 'schemes', 'search', 'sector', 'see', 'select', 'service',
          'shall', 'she', 'should', 'show', 'sir', 'site', 'so', 'some', 'someone', 'something', 'start', 'starting', 'state', 'step',
          'steps', 'such', 'suit', 'suitable', 'support', 'system', 'take', 'tell', 'term', 'terms', 'than', 'that', 'the', 'their',
          'them', 'then', 'there', 'these', 'they', 'this', 'those', 'through', 'time', 'to', 'too', 'top', 'type', 'under', 'unit',
          'until', 'up', 'use', 'using', 'very', 'view', 'want', 'was', 'way', 'we', 'well', 'were', 'what', 'when', 'where', 'which',
          'while', 'who', 'whom', 'why', 'will', 'with', 'work', 'working', 'would', 'year', 'years', 'yes', 'yojana', 'yojna', 'you', 'your'
        ]);

        const specificKeywords = words.filter(w => !GENERIC_STOPWORDS.has(w) && w.length > 2);

        // Explicit known domain identifiers that justify a specific scheme card
        const KNOWN_ENTITIES = [
          'mudra', 'pmmy', 'shishu', 'kishore', 'tarun', 'standup', 'stand-up', 'pmegp', 'kvic', 'vishwakarma',
          'nsfdc', 'nstfdc', 'nbcfdc', 'nskfdc', 'msy', 'amsy', 'swarnima', 'cgssc', 'green business',
          'education', 'educational', 'student', 'vidyalakshmi', 'csis', 'aakanksha', 'shiksha',
          'poultry', 'fisheries', 'pottery', 'blacksmith', 'carpenter', 'cobbler', 'safai', 'sanitation'
        ];

        const hasKnownEntity = KNOWN_ENTITIES.some(entity => lower.includes(entity));

        // Only search scheme cards if an explicit entity was named OR user gave high-signal specific keywords
        if (hasKnownEntity || specificKeywords.length >= 2) {
          const matchScores = schemesDb.map(s => {
            let score = 0;
            const fullText = `${s.name} ${s.code} ${s.category} ${s.criteria} ${s.benefits}`.toLowerCase();

            specificKeywords.forEach(kw => {
              if (s.code.toLowerCase().includes(kw)) score += 10;
              if (s.name.toLowerCase().includes(kw)) score += 8;
              if (fullText.includes(kw)) score += 3;
            });

            return { scheme: s, score };
          }).filter(item => item.score >= 8).sort((a, b) => b.score - a.score);

          if (matchScores.length > 0) {
            const topScheme = matchScores[0].scheme;
            const secondScheme = matchScores.length > 1 ? matchScores[1].scheme : null;

            let responseText = `### 🎯 Best Matched Scheme for Your Query: **${topScheme.name}**\n\n` +
              `• **Scheme Code:** \`${topScheme.code}\`\n` +
              `• **Target Beneficiary:** ${topScheme.category}\n` +
              `• **Interest Rate:** **${topScheme.rate}% p.a.** (Moratorium: ${topScheme.moratorium} Months)\n` +
              `• **Max Project Cost:** Up to ₹${topScheme.maxCost.toLocaleString('en-IN')}\n` +
              `• **Key Benefits:** ${topScheme.benefits}\n` +
              `• **Eligibility Criteria:** ${topScheme.criteria}\n` +
              `• **Required Documents:** ${topScheme.docs}\n\n`;

            if (secondScheme) {
              responseText += `💡 *Another Strong Alternative:* **${secondScheme.name}** (${secondScheme.rate}% p.a. up to ₹${secondScheme.maxCost.toLocaleString('en-IN')}).\n\n`;
            }

            responseText += `Would you like to calculate your monthly EMI or locate the nearest branch to submit your application?`;

            return {
              text: responseText,
              actions: [
                { label: '📚 Open in Scheme Vault', view: 'schemes' },
                { label: '🧮 Calculate EMI for this Scheme', view: 'calculator' },
                { label: '📍 Find Nearby Partner Branch', view: 'locator' }
              ]
            };
          }
        }

        // 40. SMART COMPREHENSIVE ADVISOR FALLBACK (Helpful Guidance, Never False Scheme Matches!)
        return {
          text: `Thank you for your question! Here is how to navigate India's concessional entrepreneurship schemes on Sahāy AI:\n\n` +
            `1. **Explore Schemes:** Government initiatives through NSFDC, NSTFDC, NBCFDC, and MUDRA provide loans ranging from **₹50,000 to ₹50 Lakhs** at subsidized interest rates between **4% and 8% p.a.**\n` +
            `2. **Moratorium Relief:** You get a **6 to 12-month repayment grace period** before paying principal EMIs.\n` +
            `3. **Collateral Free:** Loans up to ₹10 Lakhs do not require property mortgage or third-party guarantee.\n` +
            `4. **Application:** Supported online through JanSamarth or physically via your district State Channelizing Agency (SCA) and Regional Rural Banks.\n\n` +
            `Select one of the quick options below or tell me your affirmative category (SC/ST/OBC/Women) and business idea to find exact schemes!`,
          actions: [
            { label: '🔍 How to find schemes?', prompt: 'How to find schemes?' },
            { label: '📝 How to apply?', prompt: 'How to apply for a loan?' },
            { label: '🌟 Schemes for SC/ST', prompt: 'Tell me about schemes for SC and ST' },
            { label: '👩 Women Business Loans', prompt: 'Tell me about schemes for women entrepreneurs' }
          ]
        };
      };

      // Voice Input (Speech Recognition)
      const toggleVoiceInput = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Speech Recognition is not supported in this browser. Please use Chrome, Edge, or Safari.');
          return;
        }

        if (isRecording) {
          recognitionRef.current?.stop();
          setIsRecording(false);
          return;
        }

        try {
          const rec = new SpeechRec();
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'en-IN';

          rec.onstart = () => setIsRecording(true);
          rec.onend = () => setIsRecording(false);
          rec.onerror = () => setIsRecording(false);

          rec.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            setInput(spokenText);
            sendMessage(spokenText);
          };

          recognitionRef.current = rec;
          rec.start();
        } catch (err) {
          console.error('Speech recognition error:', err);
          setIsRecording(false);
        }
      };

      // Text to Speech using Female Indian (Hindi / English) Voice Model
      const toggleSpeak = (idx, text) => {
        if (!window.speechSynthesis) return;

        if (speakingIndex === idx) {
          window.speechSynthesis.cancel();
          setSpeakingIndex(null);
          return;
        }

        window.speechSynthesis.cancel();

        // Polish text for natural Indian English / Hindi voice synthesis (completely skipping and ignoring emojis)
        const cleanText = text
          // 1. Remove all emojis, pictographs, symbols, flags, and dingbats
          .replace(/\p{Extended_Pictographic}/gu, '')
          .replace(/[\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{FE00}-\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, '')
          .replace(/[\u200D\uFE0E\uFE0F]/g, '')
          // 2. Remove markdown formatting characters
          .replace(/[*#_`~]/g, '')
          // 3. Remove URLs
          .replace(/https?:\/\/\S+/g, '')
          // 4. Pronounce currency properly
          .replace(/₹\s*(\d[\d,]*)/g, 'Rupees $1')
          // 5. Expand abbreviations
          .replace(/\bp\.a\.\b/gi, 'per annum')
          .replace(/\bp\.a\b/gi, 'per annum')
          // 6. Sentence pauses for bullets and newlines
          .replace(/•\s*/g, '. ')
          .replace(/\n+/g, '. ')
          .replace(/\s+/g, ' ')
          .replace(/\.\s*\./g, '.')
          .trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);

        // Find or use loaded Female Indian Voice
        let voice = femaleIndianVoice;
        if (!voice && window.speechSynthesis.getVoices) {
          const currentVoices = window.speechSynthesis.getVoices();
          const targetKeywords = ['neerja', 'heera', 'swara', 'kalpana', 'veena', 'aditi', 'geeta', 'ananya', 'lekha', 'priya', 'shruti', 'sunita'];
          voice = currentVoices.find(v => targetKeywords.some(kw => v.name.toLowerCase().includes(kw)))
            || currentVoices.find(v => {
              const lang = (v.lang || '').toLowerCase().replace('_', '-');
              return (lang.includes('en-in') || lang.includes('hi-in')) && v.name.toLowerCase().includes('female');
            })
            || currentVoices.find(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('en-in'))
            || currentVoices.find(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('hi') || v.name.includes('हिन्दी'))
            || currentVoices.find(v => v.name.toLowerCase().includes('india'))
            || currentVoices.find(v => v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('female'))
            || currentVoices[0];
        }

        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang || 'en-IN';
        } else {
          utterance.lang = 'en-IN';
        }

        // Tuned for polite, natural female Indian pronunciation
        utterance.rate = 0.95;   // Gentle, clear conversational pace
        utterance.pitch = 1.15;  // Warm feminine pitch tuning
        utterance.volume = 1.0;

        utterance.onend = () => setSpeakingIndex(null);
        utterance.onerror = (e) => {
          console.warn('Speech synthesis notice:', e);
          setSpeakingIndex(null);
        };

        setSpeakingIndex(idx);
        window.speechSynthesis.speak(utterance);
      };

      // Copy text to clipboard
      const handleCopy = (idx, text) => {
        navigator.clipboard?.writeText(text);
        setCopiedIdx(idx);
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      // Send Message handler
      const sendMessage = (msgText) => {
        const textToSend = (msgText || input).trim();
        if (!textToSend || isLoading) return;

        setInput('');
        setChatHistory(prev => [...prev, { role: 'user', text: textToSend }]);
        setIsLoading(true);

        setTimeout(() => {
          const reply = generateAiResponse(textToSend);
          setChatHistory(prev => [...prev, {
            role: 'model',
            text: reply.text,
            actions: reply.actions || []
          }]);
          setIsLoading(false);
        }, 500 + Math.random() * 400);
      };

      const handleClearChat = () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        setSpeakingIndex(null);
        setChatHistory([
          {
            role: 'model',
            text: 'Chat history cleared. How can I assist you with government schemes, loan calculations, or partner routing today?',
            actions: [
              { label: '🔍 How to find schemes?', prompt: 'How to find schemes?' },
              { label: '🌟 Top Schemes for SC/ST', prompt: 'What are the best loan schemes for SC and ST entrepreneurs?' },
              { label: '👩 Women Business Loans', prompt: 'Tell me about schemes for women entrepreneurs with low interest' },
              { label: '📋 Documents Required', prompt: 'What documents are required to apply for a concessional loan?' }
            ]
          }
        ]);
      };

      // Suggested quick chips
      const SUGGESTED_CHIPS = [
        { label: '🔍 How to Find Schemes?', prompt: 'How to find schemes?' },
        { label: '📝 How to Apply?', prompt: 'What is the step by step process to apply for a scheme?' },
        { label: '🌟 SC/ST Schemes', prompt: 'What are the best loan schemes for SC and ST entrepreneurs?' },
        { label: '🌸 Women Loans (4%)', prompt: 'Tell me about Mahila Samriddhi and women business loans at 4% interest' },
        { label: '🎓 Educational Loans', prompt: 'Tell me about educational loans and student interest subsidies' },
        { label: '📋 Required Documents', prompt: 'What documents are required for government business loans?' },
        { label: '🛡️ Zero Collateral Loans', prompt: 'How can I get a loan without any property collateral or security?' },
        { label: '🏦 Mudra PMMY Details', prompt: 'Explain Pradhan Mantri Mudra Yojana Shishu, Kishore and Tarun' },
        { label: '🏭 PMEGP 35% Subsidy', prompt: 'How does PMEGP 35% margin money subsidy work?' },
        { label: '🛠️ PM Vishwakarma', prompt: 'Explain PM Vishwakarma scheme for artisans and toolkits' },
        { label: '🧮 Calculate 2 Lakh EMI', prompt: 'Calculate EMI for 200000 at 6% for 5 years' },
        { label: '⏳ What is Moratorium?', prompt: 'What is a moratorium period and how does it help new businesses?' },
        { label: '📍 Find Local Partners', prompt: 'Where can I apply and find partners in my district?' }
      ];

      // Markdown-like message formatter for rich AI responses
      const renderFormattedMessage = (text) => {
        if (!text) return null;
        const lines = text.split('\n');

        const parseInline = (str) => {
          const parts = str.split(/(\*\*[^*]+\*\*|`[^`]+`|https?:\/\/[^\s]+)/g);
          return parts.map((part, pIdx) => {
            if (part.startsWith('**') && part.endsWith('**') && part.length >= 4) {
              return <strong key={pIdx} className="ai-bold-text">{part.slice(2, -2)}</strong>;
            }
            if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
              return <code key={pIdx}>{part.slice(1, -1)}</code>;
            }
            if (part.startsWith('http://') || part.startsWith('https://')) {
              return (
                <a key={pIdx} href={part} target="_blank" rel="noopener noreferrer" className="ai-chat-link">
                  {part}
                </a>
              );
            }
            return part;
          });
        };

        return (
          <div className="ai-formatted-content">
            {lines.map((line, lIdx) => {
              const trimmed = line.trim();
              if (!trimmed) {
                return <div key={lIdx} style={{ height: '6px' }} />;
              }

              // ### Heading
              if (trimmed.startsWith('### ')) {
                return (
                  <div key={lIdx} className="ai-message-heading">
                    <AppIcon name="sparkles" size={16} style={{ color: '#ff7722', flexShrink: 0 }} />
                    <span>{parseInline(trimmed.replace(/^###\s*/, ''))}</span>
                  </div>
                );
              }

              // ## or # Heading
              if (trimmed.startsWith('## ') || trimmed.startsWith('# ')) {
                return (
                  <div key={lIdx} className="ai-message-heading">
                    <AppIcon name="info" size={16} style={{ color: '#ff7722', flexShrink: 0 }} />
                    <span>{parseInline(trimmed.replace(/^#+\s*/, ''))}</span>
                  </div>
                );
              }

              // Bullet item • or - or *
              if (/^[•\-\*]\s+/.test(trimmed)) {
                const bulletText = trimmed.replace(/^[•\-\*]\s+/, '');
                return (
                  <div key={lIdx} className="ai-bullet-item">
                    <span className="ai-bullet-dot"></span>
                    <div className="ai-bullet-content">{parseInline(bulletText)}</div>
                  </div>
                );
              }

              // Numbered item 1. 2. etc.
              const numMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
              if (numMatch) {
                return (
                  <div key={lIdx} className="ai-numbered-item">
                    <span className="ai-num-badge">{numMatch[1]}</span>
                    <div className="ai-num-content">{parseInline(numMatch[2])}</div>
                  </div>
                );
              }

              // Standard text paragraph
              return (
                <p key={lIdx} className="ai-message-p">
                  {parseInline(trimmed)}
                </p>
              );
            })}
          </div>
        );
      };

      return (
        <div className="container animate-fade-in ai-mentor-container">
          {/* Main Chat Box */}
          <div className="ai-chat-box">
            {/* Unified Sleek Header */}
            <div className="ai-chat-header">
              <div className="ai-chat-header-left">
                <div className="ai-avatar-pulse">
                  <AppIcon name="bot" size={22} />
                </div>
                <div className="ai-chat-header-text">
                  <div className="ai-chat-title-row">
                    <h2 className="ai-chat-title">Sahāy Smart Assistant</h2>
                    <span className="ai-badge-live">AI Advisor</span>
                    <span className="ai-schemes-count">
                      <span className="ai-dot-pulse"></span>
                      {(schemesDb.length > 0 ? schemesDb.length : (vaultSchemes.length || 24))} Schemes Connected
                    </span>
                  </div>
                  <div className="ai-chat-subtitle">
                    Instant guidance on Central & State government schemes, interest rates & partner routing
                  </div>
                </div>
              </div>

              <div className="ai-chat-header-right">
                <span className="ai-voice-badge">
                  <AppIcon name="volume-2" size={12} />
                  <span>{femaleIndianVoice ? femaleIndianVoice.name.split('-')[0].trim() : 'Female Indian Voice'}</span>
                </span>
                <button 
                  className="ai-clear-action-btn" 
                  onClick={handleClearChat} 
                  title="Clear conversation history">
                  <AppIcon name="trash-2" size={13} />
                  <span>Clear Chat</span>
                </button>
              </div>
            </div>

            {/* Messages Scroll Area */}
            <div className="ai-chat-messages">
              {chatHistory.map((msg, idx) => (
                <div
                  key={idx}
                  style={{
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: msg.role === 'user' ? 'flex-end' : 'flex-start',
                    gap: '4px',
                    width: '100%'
                  }}>
                  <div className={msg.role === 'user' ? 'chat-bubble-user animate-fade-in' : 'chat-bubble-ai animate-fade-in'}>
                    {msg.role === 'user' ? (
                      <div>{msg.text}</div>
                    ) : (
                      renderFormattedMessage(msg.text)
                    )}

                    {/* Action Buttons inside Bot Message */}
                    {msg.actions && msg.actions.length > 0 && (
                      <div className="chat-actions-container">
                        <div className="chat-actions-label">
                          <AppIcon name="sparkles" size={13} style={{ color: '#ff7722' }} />
                          <span>Recommended Quick Actions</span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {msg.actions.map((act, aIdx) => (
                            <button
                              key={aIdx}
                              className="chat-action-btn"
                              onClick={() => {
                                if (act.view) setView(act.view);
                                else if (act.prompt) sendMessage(act.prompt);
                              }}>
                              <span>{act.label}</span>
                              <AppIcon name="external-link" size={12} />
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Meta tools for AI messages (Speech & Copy) */}
                  {msg.role === 'model' && (
                    <div className="message-meta-toolbar">
                      <button
                        className={`meta-tool-btn ${speakingIndex === idx ? 'active-speaking' : ''}`}
                        onClick={() => toggleSpeak(idx, msg.text)}
                        title={speakingIndex === idx ? 'Stop Voice Narration' : `Listen in Female Indian Voice (${femaleIndianVoice ? femaleIndianVoice.name.split('-')[0].trim() : 'Hindi / English'})`}>
                        <AppIcon name={speakingIndex === idx ? 'volume-x' : 'volume-2'} size={13} />
                        <span>{speakingIndex === idx ? 'Stop Audio' : 'Listen'}</span>
                      </button>
                      <button
                        className="meta-tool-btn"
                        onClick={() => handleCopy(idx, msg.text)}
                        title="Copy to Clipboard">
                        <AppIcon name={copiedIdx === idx ? 'check' : 'copy'} size={13} />
                        <span>{copiedIdx === idx ? 'Copied!' : 'Copy'}</span>
                      </button>
                    </div>
                  )}
                </div>
              ))}

              {/* Typing indicator */}
              {isLoading && (
                <div className="ai-typing-indicator animate-fade-in">
                  <AppIcon name="bot" size={16} className="ai-typing-icon" />
                  <span className="ai-typing-text">Sahāy AI is searching criteria & guidelines</span>
                  <div style={{ display: 'flex', alignItems: 'center', marginLeft: '4px' }}>
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Quick Suggestion Chips Carousel */}
            <div className="prompt-chips-wrapper">
              {SUGGESTED_CHIPS.map((chip, cIdx) => (
                <button
                  key={cIdx}
                  className="prompt-chip"
                  onClick={() => sendMessage(chip.prompt)}
                  disabled={isLoading}>
                  {chip.label}
                </button>
              ))}
            </div>

            {/* Input Bar */}
            <div className="ai-chat-input-bar">
              <div className="chat-input-capsule">
                {/* Voice Input Mic Button */}
                <button
                  type="button"
                  className={`mic-btn-inline ${isRecording ? 'mic-recording' : ''}`}
                  onClick={toggleVoiceInput}
                  title={isRecording ? 'Listening... Click to stop' : 'Speak your question (Voice Input)'}>
                  <AppIcon name={isRecording ? 'mic-off' : 'mic'} size={18} />
                </button>

                {/* Text Input */}
                <input
                  type="text"
                  className="chat-input-field"
                  placeholder={isRecording ? '🎙️ Listening to your voice... Speak now!' : 'Ask about finding schemes, how to apply, loan EMI, documents...'}
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && sendMessage()}
                  disabled={isLoading}
                />

                {/* Send Button */}
                <button
                  className="chat-send-btn"
                  onClick={() => sendMessage()}
                  disabled={isLoading || !input.trim()}>
                  <AppIcon name="send" size={15} />
                  <span className="hidden-mobile">Send</span>
                </button>
              </div>
            </div>

            {/* Disclaimer Footer */}
            <div className="chat-disclaimer-text">
              <AppIcon name="info" size={13} style={{ color: '#22c55e' }} />
              <span>Government Concessional Finance Assistant • Unbiased Scheme Discovery • Verified Channel Routing</span>
            </div>
          </div>
        </div>
      );
    };

    const AuthModal = ({ onClose, onLoginSuccess, initialSignUp = false }) => {
      const [isSignUp, setIsSignUp] = useState(initialSignUp);
      const [email, setEmail] = useState('');
      const [name, setName] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');

      const [isForgotPassword, setIsForgotPassword] = useState(false);

      const handleAuth = async () => {
        setLoading(true);
        setError('');
        setMessage('');

        if (isForgotPassword) {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin,
          });
          if (error) {
            setError(error.message);
          } else {
            setMessage('Password reset link sent! Please check your email.');
          }
        } else if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
          });
          if (error) {
            setError(error.message);
          } else {
            setMessage('Sign up successful! Please check your email to verify your account if required.');
            if (data.session) onLoginSuccess(data.session);
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            setError(error.message);
          } else {
            onLoginSuccess(data.session);
          }
        }
        setLoading(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '400px', textAlign: 'center' }}>
            <button className="modal-close" onClick={onClose}>
              <i data-lucide="x" style={{ width: 24, height: 24 }}></i>
            </button>
            <h2 style={{ marginBottom: '16px' }}>
              {isForgotPassword ? 'Reset Password' : (isSignUp ? 'Create an Account' : 'Login to Sahāy')}
            </h2>
            <i data-lucide="shield-check" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px', display: 'block' }}></i>

            {error && <div style={{ color: '#ef4444', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}
            {message && <div style={{ color: 'var(--success)', marginBottom: '16px', fontSize: '0.9rem' }}>{message}</div>}

            <div>
              <p style={{ color: 'var(--text-muted)', marginBottom: '16px' }}>
                {isForgotPassword
                  ? 'Enter your email and we will send you a reset link.'
                  : (isSignUp ? 'Enter your email and password to register.' : 'Enter your email and password to access personalized features.')}
              </p>

              {isSignUp && (
                <input type="text" className="chat-input" placeholder="Full Name" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%', marginBottom: '12px' }} />
              )}
              <input type="email" className="chat-input" placeholder="Email address" value={email} onChange={e => setEmail(e.target.value)} style={{ width: '100%', marginBottom: '12px' }} />

              {!isForgotPassword && (
                <input type="password" className="chat-input" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', marginBottom: '8px' }} />
              )}

              {!isForgotPassword && !isSignUp && (
                <div style={{ textAlign: 'right', marginBottom: '16px' }}>
                  <span style={{ fontSize: '0.85rem', color: 'var(--primary)', cursor: 'pointer' }} onClick={() => { setIsForgotPassword(true); setError(''); setMessage(''); }}>
                    Forgot Password?
                  </span>
                </div>
              )}

              {isSignUp && <div style={{ marginBottom: '16px' }}></div>}

              <button className="btn btn-primary" style={{ width: '100%', marginBottom: '16px' }} onClick={handleAuth} disabled={loading || !email || (!isForgotPassword && !password) || (isSignUp && !name)}>
                {loading ? 'Processing...' : (isForgotPassword ? 'Send Reset Link' : (isSignUp ? 'Sign Up' : 'Log In'))}
              </button>

              <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>
                {isForgotPassword ? (
                  <span style={{ color: 'var(--primary)', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => { setIsForgotPassword(false); setError(''); setMessage(''); }}>
                    Back to Login
                  </span>
                ) : (
                  <>
                    {isSignUp ? 'Already have an account? ' : "Don't have an account? "}
                    <span style={{ color: 'var(--primary)', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => { setIsSignUp(!isSignUp); setError(''); setMessage(''); }}>
                      {isSignUp ? 'Log In' : 'Sign Up'}
                    </span>
                  </>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MouseTrail = () => {
      useEffect(() => {
        const container = document.createElement('div');
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '100vw';
        container.style.height = '100vh';
        container.style.pointerEvents = 'none';
        container.style.zIndex = '99999';
        container.style.overflow = 'hidden';
        document.body.appendChild(container);

        let lastTime = 0;
        let lastX = null;
        let lastY = null;

        const createBubble = (x, y) => {
          const now = Date.now();
          if (now - lastTime < 30) return;
          lastTime = now;

          // Calculate movement direction
          if (lastX === null) { lastX = x; lastY = y; }
          const dx = x - lastX;
          const dy = y - lastY;
          lastX = x;
          lastY = y;

          // If no movement, don't generate a direction
          if (dx === 0 && dy === 0) return;

          const spark = document.createElement('div');
          const size = Math.random() * 4 + 2;

          spark.style.position = 'absolute';
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;
          spark.style.width = `${size}px`;
          spark.style.height = `${size}px`;
          spark.style.borderRadius = '50%';

          const colors = ['#3b82f6', '#60a5fa', '#93c5fd', '#818cf8'];
          spark.style.background = colors[Math.floor(Math.random() * colors.length)];
          spark.style.boxShadow = `0 0 6px ${spark.style.background}`;

          // Calculate trajectory based on mouse movement (shoot backwards like a tail)
          const baseAngle = Math.atan2(-dy, -dx);
          const spread = (Math.random() - 0.5) * (Math.PI / 2); // 90 degree total spread cone
          const angle = baseAngle + spread;
          const distance = Math.random() * 60 + 20;
          const rotation = angle * (180 / Math.PI);

          spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(0px) scale(1)`;
          spark.style.transition = 'all 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          spark.style.opacity = '1';

          container.appendChild(spark);

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(${distance}px) scale(0)`;
              spark.style.opacity = '0';
            });
          });

          setTimeout(() => {
            if (container.contains(spark)) container.removeChild(spark);
          }, 1000);
        };

        const handleMouseMove = (e) => createBubble(e.clientX, e.clientY);
        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            createBubble(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('touchmove', handleTouchMove);
          if (document.body.contains(container)) document.body.removeChild(container);
        };
      }, []);

      return null;
    };

    const App = () => {

      const [theme, setTheme] = useState(() => localStorage.getItem('sahay_theme') || 'light');

      useEffect(() => {
        if (theme === 'dark') {
          document.body.classList.add('dark-theme');
        } else {
          document.body.classList.remove('dark-theme');
        }
        localStorage.setItem('sahay_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'light' ? 'dark' : 'light'));
      };

      const getInitialState = (key, defaultValue) => {
        if (key === 'sahay_currentView') {
          const hash = window.location.hash.replace('#', '').trim();
          if (['home', 'wizard', 'schemes', 'calculator', 'locator', 'ai-mentor'].includes(hash)) {
            return hash;
          }
        }
        const saved = localStorage.getItem(key);
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return defaultValue;
          }
        }
        return defaultValue;
      };

      const [currentView, setView] = useState(() => getInitialState('sahay_currentView', 'home'));
      const [session, setSession] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignUpMode, setIsSignUpMode] = useState(false);
      const [formData, setFormData] = useState(() => getInitialState('sahay_formData', {
        name: '',
        phone: '',
        isVerified: false,
        age: '',
        gender: 'Male',
        category: 'SC',
        loanType: 'Business Loan',
        income: '',
        cost: ''
      }));

      useEffect(() => {
        localStorage.setItem('sahay_currentView', JSON.stringify(currentView));
      }, [currentView]);

      useEffect(() => {
        localStorage.setItem('sahay_formData', JSON.stringify(formData));
      }, [formData]);

      const [showRecoveryModal, setShowRecoveryModal] = useState(false);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          setSession(session);
          if (event === 'PASSWORD_RECOVERY') {
            setShowRecoveryModal(true);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentView, formData, showAuthModal, session]);

      const [vaultSchemes, setVaultSchemes] = useState([]);

      useEffect(() => {
        const fetchGlobalVault = async () => {
          const { data, error } = await supabase.from('nsfdc_schemes').select('*');
          if (!error && data) {
            setVaultSchemes(data);
          }
        };
        fetchGlobalVault();
        const sub = supabase
          .channel('app-global-vault-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'nsfdc_schemes' }, fetchGlobalVault)
          .subscribe();
        return () => supabase.removeChannel(sub);
      }, []);

      const handleProtectedView = (viewName) => {
        if (!session && viewName !== 'home' && viewName !== 'ai-mentor') {
          setIsSignUpMode(false);
          setShowAuthModal(true);
        } else {
          setView(viewName);
        }
      };

      return (
        <>
          <MouseTrail />
          <Navbar currentView={currentView} setView={handleProtectedView} session={session} onAuthClick={(isSignUp) => { setIsSignUpMode(isSignUp); setShowAuthModal(true); }} formData={formData} theme={theme} toggleTheme={toggleTheme} />
          <main>
            {!session && currentView !== 'ai-mentor' ? (
              <LandingPage onAuthClick={(isSignUp) => { setIsSignUpMode(isSignUp); setShowAuthModal(true); }} setView={handleProtectedView} />
            ) : (
              <>
                {currentView === 'home' && <Home setView={handleProtectedView} />}
                {currentView === 'wizard' && <Wizard setView={handleProtectedView} formData={formData} setFormData={setFormData} session={session} />}
                {currentView === 'schemes' && <Schemes setView={handleProtectedView} formData={formData} session={session} vaultSchemes={vaultSchemes} />}
                {currentView === 'calculator' && <LoanCalculator />}
                {currentView === 'locator' && <PartnerLocator />}
                {currentView === 'ai-mentor' && <AiMentor setView={handleProtectedView} formData={formData} session={session} vaultSchemes={vaultSchemes} />}
                {!['home', 'wizard', 'schemes', 'calculator', 'locator', 'ai-mentor'].includes(currentView) && <Home setView={handleProtectedView} />}
              </>
            )}
          </main>

          {showAuthModal && (
            <AuthModal
              onClose={() => setShowAuthModal(false)}
              onLoginSuccess={(session) => {
                setShowAuthModal(false);
              }}
              initialSignUp={isSignUpMode}
            />
          )}


          {showRecoveryModal && (
            <RecoveryModal onClose={() => setShowRecoveryModal(false)} />
          )}
        </>
      );
    };

    const RecoveryModal = ({ onClose }) => {
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');

      const handleReset = async () => {
        setLoading(true);
        setError('');
        setMessage('');
        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          setError(error.message);
        } else {
          setMessage('Password updated successfully! You can now use your new password.');
          setTimeout(() => {
            onClose();
          }, 3000);
        }
        setLoading(false);
      };

      return (
        <div className="modal-overlay animate-fade-in" style={{ zIndex: 99999, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div className="modal-content glass" style={{ maxWidth: '400px', width: '90%', padding: '32px', textAlign: 'center', borderRadius: '24px' }}>
            <i data-lucide="key" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px' }}></i>
            <h2 style={{ marginBottom: '12px' }}>Set New Password</h2>
            <p style={{ color: 'var(--text-muted)', marginBottom: '24px', fontSize: '0.95rem' }}>Enter your new password below.</p>

            {error && <div style={{ color: '#ef4444', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}
            {message && <div style={{ color: 'var(--success)', marginBottom: '16px', fontSize: '0.9rem' }}>{message}</div>}

            <input type="password" className="chat-input" placeholder="New Password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', marginBottom: '16px' }} />

            <button className="btn btn-primary" onClick={handleReset} style={{ width: '100%', padding: '12px', borderRadius: '12px' }} disabled={loading}>
              {loading ? 'Updating...' : 'Update Password'}
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>

</html>
