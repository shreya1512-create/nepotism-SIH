<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google Fonts -->

        } else {

          document.documentElement.style.overflow = 'unset';

            <div className="logo">
              <svg width="44" height="44" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">

                    <stop offset="100%" stopColor="#a855f7" />
                  </linearGradient>

                    <stop offset="0%" stopColor="#3b82f6" />
                    <stop offset="100%" stopColor="#10b981" />
                  </linearGradient>
                  <linearGradient id="gradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#f59e0b" />
                    <stop offset="100%" stopColor="#ef4444" />
                  </linearGradient>
                </defs>
                <path d="M 24 10 A 8 8 0 1 0 8 10 A 8 8 0 0 0 16 18 H 20 A 4 4 0 0 0 24 14 Z" fill="url(#gradTop)" opacity="0.95" />
                <path d="M 12 26 A 8 8 0 1 0 28 26 A 8 8 0 0 0 20 18 H 16 A 4 4 0 0 0 12 22 Z" fill="url(#gradBot)" opacity="0.95" />
                <path d="M 28 5 C 28 8 31 8 31 8 C 31 8 28 8 28 11 C 28 8 25 8 25 8 C 25 8 28 8 28 5 Z" fill="url(#gradSpark)" />
              </svg>
              <div className="logo-text-container">
                <span className="logo-title">
                  Sahāy <span>AI</span>
                </span>
                <span className="logo-credit">
                  BY TEAM NEPOTISM
                </span>
              </div>
            </div>
          </div>

          {/* OVERLAY for Mobile */}
          {isMobileMenuOpen && (
            <div className="mobile-overlay" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}

          {/* CENTER: ACTION BUTTONS (Sidebar on mobile) */}
          <div className={`nav-links sidebar-menu ${isMobileMenuOpen ? 'open' : ''}`}>
            <div className="mobile-sidebar-header">
              <h3>Menu</h3>
              <button className="btn-icon" onClick={() => setIsMobileMenuOpen(false)}>
                <i data-lucide="x" style={{ width: 24, height: 24 }}></i>
              </button>
            </div>
            {!session ? (
              <>
                <a href="#benefits" onClick={() => setIsMobileMenuOpen(false)} className="nav-item"><i data-lucide="star" style={{ width: 16, height: 16 }}></i> Benefits</a>
                <a href="#how-it-works" onClick={() => setIsMobileMenuOpen(false)} className="nav-item"><i data-lucide="info" style={{ width: 16, height: 16 }}></i> How it Works</a>
                <a href="#faqs" onClick={() => setIsMobileMenuOpen(false)} className="nav-item"><i data-lucide="help-circle" style={{ width: 16, height: 16 }}></i> FAQs</a>
                <a href="#contact" onClick={() => setIsMobileMenuOpen(false)} className="nav-item"><i data-lucide="mail" style={{ width: 16, height: 16 }}></i> Contact</a>
              </>
            ) : (
              <>
                <a className={`nav-item ${currentView === 'home' ? 'active' : ''}`} onClick={() => handleNavClick('home')}>
                  <i data-lucide="layout-dashboard" style={{ width: 16, height: 16 }}></i> Dashboard
                </a>
                <a className={`nav-item ${currentView === 'wizard' ? 'active' : ''}`} onClick={() => handleNavClick('wizard')}>
                  <i data-lucide="sparkles" style={{ width: 16, height: 16 }}></i> AI Match
                </a>
                <a className={`nav-item ${currentView === 'schemes' ? 'active' : ''}`} onClick={() => handleNavClick('schemes')}>
                  <i data-lucide="library" style={{ width: 16, height: 16 }}></i> Scheme Vault
                </a>
                <a className={`nav-item ${currentView === 'calculator' ? 'active' : ''}`} onClick={() => handleNavClick('calculator')}>
                  <i data-lucide="calculator" style={{ width: 16, height: 16 }}></i> FinCalc
                </a>
                <a className={`nav-item ${currentView === 'locator' ? 'active' : ''}`} onClick={() => handleNavClick('locator')}>
                  <i data-lucide="map-pin" style={{ width: 16, height: 16 }}></i> Connect
                </a>
              </>
            )}
          </div>

          {/* RIGHT: LOGIN/EMAIL */}
          <div className="nav-right">
            <button className="btn-icon" onClick={toggleTheme} style={{ marginRight: '16px' }} title="Toggle Theme">
              {theme === 'dark' ? <i data-lucide="sun" style={{ width: 20, height: 20 }}></i> : <i data-lucide="moon" style={{ width: 20, height: 20 }}></i>}

            {session ? (
              <div className="flex items-center gap-4">

                  <span className="user-email" style={{ fontSize: '0.9rem', color: 'var(--text-muted)', display: 'inline-flex', alignItems: 'center', gap: '6px', whiteSpace: 'nowrap', cursor: 'pointer', padding: '6px 0' }} onClick={() => setShowEmail(!showEmail)}>
                    <i data-lucide="user" style={{ width: 16, height: 16, flexShrink: 0 }}></i>
                    <span style={{ fontWeight: session?.user?.user_metadata?.full_name ? 'bold' : 'normal', color: session?.user?.user_metadata?.full_name ? 'var(--text-main)' : 'inherit' }}>
                      {session?.user?.user_metadata?.full_name || 'My Profile'}
                    </span>
                  </span>
                  {showEmail && (
                    <div className="glass-card animate-fade-in" style={{ position: 'absolute', top: '100%', right: '0', marginTop: '8px', padding: '10px 16px', zIndex: 100, display: 'flex', alignItems: 'center', boxShadow: '0 8px 20px rgba(0,0,0,0.15)', border: '1px solid var(--border)', whiteSpace: 'nowrap' }}>
                      <span style={{ fontSize: '0.9rem', fontWeight: 'bold', color: 'var(--text-main)' }}>{session.user.email}</span>
                    </div>
                  )}
                </div>
                <button className="btn btn-outline nav-logout-btn" onClick={handleLogout}>Logout</button>
              </div>
            ) : (
              <div className="auth-buttons-group">
                <button className="btn btn-outline auth-btn" onClick={() => onAuthClick(false)}>Log In</button>
                <button className="btn btn-primary auth-btn" onClick={() => onAuthClick(true)}>Sign Up</button>
              </div>
            )}
          </div>
        </nav>
      );
    };

    const ContactSection = () => {
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [message, setMessage] = useState('');
      const [loading, setLoading] = useState(false);
      const [statusMessage, setStatusMessage] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setStatusMessage('');

        try {
          const { error } = await supabase.from('contact_messages').insert([
            { full_name: fullName, email: email, message: message }
          ]);

          if (error) {
            console.error('Error submitting contact message:', error);
            setStatusMessage('Failed to send message. Please try again.');
          } else {
            setStatusMessage('Thank you! Your message has been sent successfully.');
            setFullName('');
            setEmail('');
            setMessage('');
          }
        } catch (err) {
          console.error('Unexpected error:', err);
          setStatusMessage('An unexpected error occurred. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <section id="contact" style={{ background: 'var(--bg-card)', padding: '100px 16px', borderTop: 'var(--glass-border)' }}>
          <div className="container" style={{ maxWidth: '800px', margin: '0 auto' }}>
            <div className="text-center" style={{ marginBottom: '40px' }}>
              <h2 style={{ fontSize: '2.5rem', marginBottom: '16px' }}>
                Get in <span className="text-gradient">Touch</span>
              </h2>
              <p style={{ color: 'var(--text-muted)', fontSize: '1.1rem' }}>
                Have questions or need assistance? Send us a message and our team will get back to you shortly.
              </p>
            </div>

            <div className="glass-card" style={{ padding: '40px' }}>
              <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div className="input-group">
                  <label style={{ fontSize: '0.95rem', fontWeight: '600', marginBottom: '8px', color: 'var(--text-main)' }}>Full Name</label>
                  <input
                    type="text"
                    className="chat-input"
                    placeholder="Enter your full name"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    required
                  />
                </div>

                <div className="input-group">
                  <label style={{ fontSize: '0.95rem', fontWeight: '600', marginBottom: '8px', color: 'var(--text-main)' }}>Email Address</label>
                  <input
                    type="email"
                    className="chat-input"
                    placeholder="name@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                  />
                </div>

                <div className="input-group">
                  <label style={{ fontSize: '0.95rem', fontWeight: '600', marginBottom: '8px', color: 'var(--text-main)' }}>Message</label>
                  <textarea
                    className="chat-input"
                    rows="4"
                    placeholder="How can we help you?"
                    value={message}
                    onChange={(e) => setMessage(e.target.value)}
                    style={{ resize: 'vertical', width: '100%' }}
                    required
                  ></textarea>
                </div>

                {statusMessage && (
                  <div style={{
                    padding: '12px 16px',
                    borderRadius: '12px',
                    fontSize: '0.95rem',
                    background: statusMessage.includes('Thank') ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)',
                    color: statusMessage.includes('Thank') ? 'var(--success)' : '#ef4444',
                    border: statusMessage.includes('Thank') ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(239, 68, 68, 0.3)'
                  }}>
                    {statusMessage}
                  </div>
                )}

                <button
                  type="submit"
                  className="btn btn-primary"
                  disabled={loading}
                  style={{ width: '100%', padding: '14px', fontSize: '1.05rem', borderRadius: '12px', marginTop: '10px' }}
                >
                  {loading ? 'Sending...' : 'Send Message'}
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    };

    const DemoModal = ({ onClose, onStartFree }) => {
      const [selectedTab, setSelectedTab] = useState(0);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [selectedTab]);

      const demoScenarios = [
        {
          title: "SC/ST Female Entrepreneur",
          prompt: "I'm a female SC entrepreneur in Maharashtra looking for ₹10 Lakhs to start a textile manufacturing unit.",
          response: "Analyzed 520+ government databases. Found 2 High-Match Schemes!",
          matches: [
            { name: "Stand-Up India Scheme", score: "98% Match", benefit: "Loan up to ₹1 Crore for SC/ST & Women, concessional interest rates", tag: "SC/ST & Women" },
            { name: "MSME Mahila Samriddhi Yojana", score: "94% Match", benefit: "Micro-credit assistance up to ₹1.4 Lakh at 4% p.a.", tag: "Women Special" }
          ]
        },
        {
          title: "OBC Micro Business Loan",
          prompt: "I run a small handicraft shop. I need ₹2 Lakhs working capital.",
          response: "Matched with Central Ministry Schemes for Artisans & Micro-Units!",
          matches: [
            { name: "Pradhan Mantri MUDRA Yojana (Kishore)", score: "96% Match", benefit: "Collateral-free loan up to ₹5 Lakhs with low processing fee", tag: "MUDRA Scheme" },
            { name: "PM Vishwakarma Scheme", score: "92% Match", benefit: "Financial support + Skill training & Toolkit incentive of ₹15,000", tag: "Artisan Special" }
          ]
        },
        {
          title: "Education Loan Support",
          prompt: "Student seeking higher education loan assistance for B.Tech degree.",
          response: "Found Central Subsidized Loan Schemes!",
          matches: [
            { name: "NSFDC Educational Loan Scheme", score: "97% Match", benefit: "Up to ₹20 Lakhs for study in India at 4% p.a. interest", tag: "Education Support" },
            { name: "Central Sector Interest Subsidy (CSIS)", score: "91% Match", benefit: "Full interest subsidy during moratorium period for EBC students", tag: "Interest Subsidy" }
          ]
        }
      ];

      const currentScenario = demoScenarios[selectedTab];

      return (
        <div className="modal-overlay animate-fade-in" onClick={onClose} style={{ zIndex: 1100, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
          <div className="modal-content glass" onClick={e => e.stopPropagation()} style={{ maxWidth: '850px', width: '100%', padding: '32px', borderRadius: '24px', maxHeight: '90vh', overflowY: 'auto' }}>
            <div className="flex justify-between items-center mb-4" style={{ flexWrap: 'wrap', gap: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ background: 'linear-gradient(135deg, var(--primary), var(--secondary))', color: '#fff', width: '36px', height: '36px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <i data-lucide="bot" style={{ width: 20, height: 20 }}></i>
                </div>
                <div>
                  <h3 style={{ margin: 0, fontSize: '1.3rem' }}>Sahāy AI Scheme Recommender Demo</h3>
                  <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Interactive Live Preview Simulation</span>
                </div>
              </div>
              <button className="btn-icon" onClick={onClose}>
                <i data-lucide="x" style={{ width: 22, height: 22 }}></i>
              </button>
            </div>

            {/* Scenario Selector Tabs */}
            <div className="flex gap-2 mb-6" style={{ overflowX: 'auto', paddingBottom: '4px' }}>
              {demoScenarios.map((sc, idx) => (
                <button
                  key={idx}
                  onClick={() => setSelectedTab(idx)}
                  className={`btn ${selectedTab === idx ? 'btn-primary' : 'btn-outline'}`}

                  {sc.title}
                </button>
              ))}
            </div>

            {/* AI Interactive Chat Mockup */}
            <div className="glass-card" style={{ padding: '24px', background: 'rgba(15, 23, 42, 0.03)', border: '1px solid var(--border)', borderRadius: '16px', marginBottom: '24px' }}>
              {/* User Prompt */}
              <div style={{ display: 'flex', gap: '12px', marginBottom: '16px', alignItems: 'flex-start' }}>
                <div style={{ background: 'var(--border)', color: 'var(--text-main)', width: '32px', height: '32px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '0.85rem', flexShrink: 0 }}>You</div>
                <div className="glass-card" style={{ padding: '12px 18px', background: 'var(--bg-dark)', borderRadius: '14px', fontSize: '0.95rem', color: 'var(--text-main)', boxShadow: '0 2px 8px rgba(0,0,0,0.04)' }}>
                  "{currentScenario.prompt}"
                </div>
              </div>

              {/* AI Agent Response */}
              <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start' }}>
                <div style={{ background: 'var(--primary)', color: '#fff', width: '32px', height: '32px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <i data-lucide="sparkles" style={{ width: 16, height: 16 }}></i>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: '0.85rem', color: 'var(--primary)', fontWeight: 'bold', marginBottom: '8px' }}>
                    <i data-lucide="check-circle-2" style={{ width: 14, height: 14, display: 'inline', marginRight: '4px' }}></i>
                    {currentScenario.response}
                  </div>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    {currentScenario.matches.map((m, mIdx) => (
                      <div key={mIdx} className="glass-card" style={{ padding: '16px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: '12px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                          <h4 style={{ margin: 0, fontSize: '1rem', color: 'var(--text-main)' }}>{m.name}</h4>
                          <span className="badge badge-success" style={{ fontSize: '0.75rem' }}>{m.score}</span>
                        </div>
                        <p style={{ margin: 0, fontSize: '0.85rem', color: 'var(--text-muted)' }}>{m.benefit}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '16px', justifyContent: 'flex-end', flexWrap: 'wrap' }}>
              <button className="btn btn-outline" onClick={onClose} style={{ borderRadius: '20px', padding: '10px 24px' }}>Close Preview</button>
              <button className="btn btn-primary" onClick={() => { onClose(); onStartFree(); }} style={{ borderRadius: '20px', padding: '10px 28px' }}>
                Start Free Match Profile <i data-lucide="arrow-right" style={{ width: 16, height: 16, marginLeft: '6px' }}></i>
              </button>
            </div>
          </div>
        </div>
      );
    };

    const DemoSlideshowModal = ({ onClose, onSignUp }) => {
      const [currentSlide, setCurrentSlide] = useState(0);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentSlide]);

      useEffect(() => {
        let timer;
        if (currentSlide === 1) {
          setProgress(0);
          timer = setInterval(() => {
            setProgress(p => {
              if (p >= 100) {
                clearInterval(timer);
                setTimeout(() => setCurrentSlide(2), 300);
                return 100;
              }
              return p + 2;
            });
          }, 30);
        }
        return () => clearInterval(timer);
      }, [currentSlide]);

      const slides = [
        {
          title: "Step 1: Tell us about yourself",
          subtitle: "Answer a few simple questions in your preferred language.",
          content: (
            <div className="animate-fade-in" key="slide0">
              <img src="images/wizard-preview.png" style={{ width: '100%', display: 'block', borderRadius: '12px', border: '1px solid var(--border)' }} alt="Application Form Preview" />
            </div>
          )
        },
        {
          title: "Step 2: AI Match Engine at Work",
          subtitle: "Our system cross-references govt databases only in real-time.",
          content: (
            <div className="animate-fade-in" key="slide1" style={{ textAlign: 'center', padding: '40px' }}>
              <i data-lucide="brain-circuit" style={{ width: 64, height: 64, color: 'var(--primary)', margin: '0 auto 20px', display: 'block', animation: 'pulse 1.5s infinite' }}></i>
              <h4 style={{ margin: 0 }}>Scanning for eligible schemes...</h4>
              <div style={{ width: '100%', height: '8px', background: 'var(--border)', borderRadius: '4px', marginTop: '20px', overflow: 'hidden' }}>
                <div style={{ width: `${progress}%`, height: '100%', background: 'var(--primary)', transition: 'width 0.1s linear' }}></div>
              </div>
            </div>
          )
        },
        {
          title: "Step 3: Instant Scheme Matching",
          subtitle: "Get tailored results with zero paperwork friction.",
          content: (
            <div className="animate-fade-in" key="slide2" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              <div className="glass-card" style={{ padding: '16px', background: 'var(--bg-card)', border: '1px solid var(--success)', borderRadius: '12px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h4 style={{ margin: 0, color: 'var(--text-main)' }}>Stand-Up India Scheme</h4>
                  <span className="badge badge-success" style={{ fontSize: '0.75rem' }}>98% Match</span>
                </div>
                <p style={{ margin: '8px 0 0 0', fontSize: '0.85rem', color: 'var(--text-muted)' }}>Up to ₹1 Crore for SC/ST & Women</p>
              </div>
              <div className="glass-card" style={{ padding: '16px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: '12px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h4 style={{ margin: 0, color: 'var(--text-main)' }}>MUDRA Yojana</h4>
                  <span className="badge badge-success" style={{ fontSize: '0.75rem' }}>94% Match</span>
                </div>
                <p style={{ margin: '8px 0 0 0', fontSize: '0.85rem', color: 'var(--text-muted)' }}>Collateral-free loans up to ₹10 Lakhs</p>
              </div>
            </div>
          )
        }
      ];

          const phoneRegex = /^[0-9]{10}$/;
          if (formData.phone && phoneRegex.test(formData.phone)) {
            setOtpSent(true);
            alert("Demo Mode: Your OTP is 1234");
          } else {
            alert("Please enter a valid 10-digit phone number.");
          }
        };

        const verifyOtp = () => {
          if (otpInput === '1234') {
            setFormData({ ...formData, isVerified: true });
            setOtpSent(false);
          } else {
            alert("Invalid OTP! Try 1234.");
          }
        };

        const handleNext = async (e) => {
          e.preventDefault();
          if (step === 1) {
            if (!formData.isVerified) {
              alert("Please verify your phone number before proceeding.");
              return;
            }
            setStep(2);
          }
          else {
            let rawIncome = parseFloat(formData.income) || 0;
            // Auto-scale if user typed something like "10" for 10 lakhs or "105" for 1.05 crore
            if (rawIncome > 0 && rawIncome < 1000) rawIncome *= 100000;

            if (rawIncome > 10000000) {
              alert("Sorry, This site is not for you");
              return;
            }

            let rawCost = parseFloat(formData.cost) || 0;
            if (rawCost > 0 && rawCost < 1000) rawCost *= 100000;

            try {
              const { error } = await supabase.from('user_profiles').insert([{
                name: formData.name || session?.user?.user_metadata?.full_name || 'Applicant',
                phone: formData.phone,
                age: parseInt(formData.age) || null,
                gender: formData.gender,
                category: formData.category,
                loan_type: formData.loanType,
                income: rawIncome || null,
                cost: rawCost || null
              }]);
              if (error) {
                console.error("Error saving applicant data to user_profiles:", error);
              }
            } catch (err) {
              console.error("Error saving profile", err);
            }

            const newHistory = [formData, ...history.filter(h => h.phone !== formData.phone)].slice(0, 5);
            setHistory(newHistory);
            localStorage.setItem('sahay_history', JSON.stringify(newHistory));

            setView('schemes');
            setStep(1); // Reset step after successful submission
          }
        };

        const handleChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        return (
          <div className="container">
            <div className="wizard-container glass animate-fade-in" style={{ padding: '32px', maxWidth: '600px' }}>
              <div className="flex justify-between items-center mb-6" style={{ flexWrap: 'wrap', gap: '12px' }}>

                  <i data-lucide="file-search" style={{ color: "var(--primary)" }}></i>
                  Application Form
                </h2>
                <div className="flex items-center gap-2">
                  {history.length > 0 && (
                    <button type="button" onClick={() => setShowHistory(true)} className="btn btn-outline flex items-center gap-1" style={{ width: 'auto', minHeight: 'auto', padding: '6px 12px', fontSize: '0.85rem' }}>
                      <i data-lucide="history" style={{ width: 14, height: 14 }}></i> History
                    </button>
                  )}
                  <div className="badge badge-primary" style={{ whiteSpace: 'nowrap' }}>Step {step} of 2</div>
                </div>
              </div>

              {showHistory && ReactDOM.createPortal(
                <div className="modal-overlay" style={{ display: 'flex' }} onClick={() => setShowHistory(false)}>
                  <div className="modal-content glass animate-fade-in" onClick={e => e.stopPropagation()} style={{ maxWidth: '500px', width: '90%' }}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 style={{ margin: 0 }}>Previous Profiles</h3>
                      <button className="btn-icon" onClick={() => setShowHistory(false)}>
                        <i data-lucide="x"></i>
                      </button>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', maxHeight: '400px', overflowY: 'auto', paddingRight: '8px' }}>
                      {history.map((h, i) => (
                        <div key={i} className="glass-card flex flex-col gap-2" style={{ padding: '16px', cursor: 'pointer', transition: 'var(--transition)' }} onClick={() => { setFormData(h); setShowHistory(false); setView('schemes'); }}>
                          <div className="flex justify-between items-start" style={{ gap: '8px', flexWrap: 'wrap' }}>
                            <strong style={{ fontSize: '1.1rem', wordBreak: 'break-all' }}>{h.phone}</strong>
                            <span className="badge badge-success" style={{ whiteSpace: 'nowrap' }}>{h.loanType}</span>
                          </div>
                          <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>
                            Age: {h.age} | {h.gender} | {h.category} | Income: ₹{h.income || 0}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>,
                document.body
              )}

              <form onSubmit={handleNext}>
                {step === 1 && (
                  <div className="animate-fade-in">

                    <div className="input-group mt-2">
                      <label>Full Name</label>
                      <input type="text" name="name" className="chat-input" value={formData.name || ''} onChange={handleChange} placeholder="Enter your full name" required />
                    </div>

                    <div className="input-group mt-2">
                      <label>Phone Number</label>
                      <div className="flex gap-4">

                          <span style={{ color: 'var(--text-muted)', fontWeight: 'bold' }}>+91</span>
                          <input type="tel" name="phone" style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, padding: '14px 0', fontSize: '1rem', color: 'var(--text-main)', minWidth: '0' }} value={formData.phone} onChange={handleChange} required disabled={formData.isVerified} placeholder="10-digit number" pattern="[0-9]{10}" maxLength="10" title="Please enter a valid 10-digit mobile number" />
                          {formData.isVerified && (
                            <>
                              <span className="flex items-center gap-1" style={{ color: 'var(--success)', fontSize: '0.8rem', fontWeight: 'bold', whiteSpace: 'nowrap', textTransform: 'uppercase' }}>
                                <i data-lucide="check-circle" style={{ width: 16, height: 16 }}></i> Verified
                              </span>
                              <button type="button" onClick={() => setFormData({ ...formData, isVerified: false, phone: '' })} className="btn-icon" style={{ padding: '4px', marginLeft: '4px', color: 'var(--text-muted)' }} title="Change Number">
                                <i data-lucide="refresh-cw" style={{ width: 14, height: 14 }}></i>
                              </button>
                            </>
                          )}
                        </div>
                        {!formData.isVerified && !otpSent && (
                          <button type="button" className="btn btn-primary" onClick={sendOtp}>Send OTP</button>
                        )}
                      </div>
                    </div>

                    {otpSent && !formData.isVerified && (
                      <div className="input-group mt-2 p-4 glass-card" style={{ borderColor: 'var(--primary)' }}>
                        <label style={{ color: 'var(--primary)' }}>Enter OTP (Demo: 1234)</label>
                        <div className="flex gap-4 mt-2">
                          <input type="text" className="chat-input" style={{ flex: 1 }} value={otpInput} onChange={e => setOtpInput(e.target.value)} placeholder="4-digit OTP" />
                          <button type="button" className="btn btn-outline" onClick={verifyOtp}>Verify</button>
                        </div>
                      </div>
                    )}
                    <div className="grid grid-cols-2 gap-4 mt-2">
                      <div className="input-group">
                        <label>Age</label>
                        <input type="number" name="age" className="chat-input" value={formData.age} onChange={handleChange} min="0" required />
                      </div>
                      <div className="input-group">
                        <label>Gender</label>
                        <select name="gender" className="chat-input" value={formData.gender} onChange={handleChange}>
                          <option>Male</option>
                          <option>Female</option>
                          <option>Other</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 mt-2 mb-6">
                      <div className="input-group">
                        <label>Social Category</label>
                        <select name="category" className="chat-input" value={formData.category} onChange={handleChange}>
                          <option>SC</option>
                          <option>ST</option>
                          <option>OBC</option>
                          <option>General</option>
                        </select>
                      </div>
                      <div className="input-group">
                        <label>Requirement Type</label>
                        <select name="loanType" className="chat-input" value={formData.loanType} onChange={handleChange}>
                          <option>Business Loan</option>
                          <option>Education Loan</option>
                        </select>
                      </div>
                    </div>

                    <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>
                      Next Step <i data-lucide="chevron-right" style={{ width: 18, height: 18 }}></i>
                    </button>

                )}

                {step === 2 && (
                  <div className="animate-fade-in">
                    <div className="input-group mt-2">
                      <label>Annual Family Income (₹)</label>
                      <input type="number" name="income" className="chat-input" value={formData.income} onChange={handleChange} min="0" required />
                    </div>

                    <div className="input-group mt-2 mb-6">
                      <label>Estimated Project/Education Cost (₹)</label>
                      <input type="number" name="cost" className="chat-input" value={formData.cost} onChange={handleChange} min="0" required />
                    </div>

                    <div className="flex gap-4">
                      <button type="button" className="btn btn-outline" onClick={() => setStep(1)} style={{ flex: 1 }}>
                        Back
                      </button>
                      <button type="submit" className="btn btn-primary" style={{ flex: 2 }}>
                        <i data-lucide="sparkles" style={{ width: 18, height: 18 }}></i> Find Schemes
                      </button>

                  </div>
                )}
              </form>
            </div>
          </div>
        );
      };

      const Schemes = ({ setView, formData, session }) => {
        const [allSchemes, setAllSchemes] = useState([]);
        const [eligibleSchemes, setEligibleSchemes] = useState([]);
        const [loading, setLoading] = useState(true);
        const [selectedScheme, setSelectedScheme] = useState(null);

        useEffect(() => {
          const fetchSchemes = async () => {
            const { data: allData, error } = await supabase.from('nsfdc_schemes').select('*');
            if (error) {
              console.error("Error fetching schemes:", error);
            }

            let eligibleData = [];
            if (formData.isVerified && allData) {
              eligibleData = allData.filter(scheme => {
                // Category matching
                const schemeCat = (scheme.category || 'ALL').toLowerCase();
                const userCat = (formData.category || '').toLowerCase();
                const userGender = (formData.gender || '').toLowerCase();

                let categoryMatch = false;
                if (schemeCat === 'all') {
                  categoryMatch = true;
                } else if (schemeCat === userCat) {
                  categoryMatch = true;
                } else if (schemeCat === userCat + ' female') {
                  categoryMatch = (userGender === 'female');
                }

                // Smart Income & Cost Parsing
                let rawIncome = parseFloat(formData.income) || 0;
                if (rawIncome > 0 && rawIncome < 1000) rawIncome *= 100000;

                let incomeMatch = true;
                if (scheme.max_family_income && rawIncome > scheme.max_family_income) {
                  incomeMatch = false;
                }

                let rawCost = parseFloat(formData.cost) || 0;
                if (rawCost > 0 && rawCost < 1000) rawCost *= 100000;

                let costMatch = true;
                if (scheme.max_project_cost && rawCost > scheme.max_project_cost) {
                  costMatch = false;
                }
                if (scheme.min_project_cost && rawCost < scheme.min_project_cost) {
                  costMatch = false;
                }

                // Age Matching
                const userAge = parseInt(formData.age) || 0;
                let ageMatch = true;
                if (scheme.min_age && userAge < scheme.min_age) ageMatch = false;
                if (scheme.max_age && userAge > scheme.max_age) ageMatch = false;

                // Loan Type Matching
                let loanTypeMatch = true;
                const userLoan = (formData.loanType || '').toLowerCase();
                const schemeLoan = (scheme.loan_type || '').toLowerCase();
                if (schemeLoan && userLoan && schemeLoan !== userLoan) {
                  loanTypeMatch = false;
                }

                return categoryMatch && incomeMatch && costMatch && ageMatch && loanTypeMatch;
              });
            }

            setAllSchemes(allData || []);
            setEligibleSchemes(eligibleData);
            setLoading(false);
          };

          fetchSchemes();

          // Realtime subscription for govt updates
          const subscription = supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'nsfdc_schemes' }, (payload) => {
              console.log('Real-time scheme change received:', payload);
              fetchSchemes(); // Re-fetch all schemes to ensure we have the latest UI
            })
            .subscribe();

          return () => {
            supabase.removeChannel(subscription);
          };
        }, [formData, session]);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [selectedScheme, loading, allSchemes, eligibleSchemes]);

        const renderSchemeCard = (scheme, isEligible, idx) => (
          <div key={scheme.id + (isEligible ? '-el' : '-all')} className={`glass-card stagger-${(idx % 3) + 1} animate-fade-in`} style={{ position: 'relative', overflow: 'hidden' }}>
            {isEligible && (
              <div style={{
                position: 'absolute', top: 0, right: 0,
                background: 'linear-gradient(135deg, var(--success), #059669)',
                color: 'white', padding: '4px 12px',
                borderBottomLeftRadius: '12px', fontWeight: 'bold', fontSize: '0.8rem'
              }}>
                Eligible
              </div>
            )}
            <h3 className="mt-2">{scheme.scheme_name}</h3>
            <p className="mb-2 mt-2" style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}><strong>Eligibility:</strong> {scheme.eligibility_criteria}</p>
            <p className="mb-4 mt-2" style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}><strong>Benefits:</strong> {scheme.benefits_summary}</p>
            <div className="flex gap-2 mb-4 flex-wrap">
              {scheme.category && (
                <span className="badge badge-primary">{scheme.category}</span>
              )}
              {scheme.loan_type && (
                <span className="badge badge-primary">{scheme.loan_type}</span>
              )}
              {scheme.max_project_cost > 0 && (
                <span className="badge badge-primary">Up to ₹{scheme.max_project_cost / 100000} Lakhs</span>
              )}
              {scheme.interest_rate_pa && (
                <span className="badge badge-primary">{scheme.interest_rate_pa}% p.a.</span>
              )}
            </div>
            <button className="btn btn-outline" style={{ width: '100%' }} onClick={() => setSelectedScheme(scheme)}>
              View Details & Apply <i data-lucide="chevron-right" style={{ width: 16, height: 16 }}></i>
            </button>
          </div>
        );

        if (loading) {
          return <div className="container text-center mt-6">Loading schemes...</div>;
        }

        return (
          <>
            <div className="container animate-fade-in" style={{ paddingTop: '40px', maxWidth: '1200px' }}>
              <div className="flex justify-between items-center mb-6">
                <div>
                  <button className="btn btn-outline mb-4" onClick={() => setView('wizard')} style={{ padding: '6px 12px', fontSize: '0.85rem' }}>
                    &larr; Back to Profile
                  </button>
                  <h2>Government Schemes</h2>
                  <p style={{ color: 'var(--text-muted)' }}>Explore all available government schemes and your matched eligibility.</p>
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '48px' }}>
                <div>
                  <h3 className="mb-4 flex items-center gap-2" style={{ color: 'var(--success)' }}>
                    <i data-lucide="check-circle" style={{ width: 24, height: 24 }}></i>
                    Matched For You ({eligibleSchemes.length})
                  </h3>
                  {!formData.isVerified ? (
                    <div className="glass-card text-center" style={{ padding: '40px' }}>
                      <i data-lucide="user-x" style={{ width: 48, height: 48, color: 'var(--text-muted)', margin: '0 auto 16px' }}></i>
                      <p style={{ color: 'var(--text-muted)' }}>Complete your profile application to discover your personalized scheme matches.</p>
                      <button className="btn btn-primary mt-4" onClick={() => setView('wizard')}>Start Application</button>
                    </div>
                  ) : eligibleSchemes.length === 0 ? (
                    <div className="glass-card text-center" style={{ padding: '40px' }}>
                      <p style={{ color: 'var(--text-muted)' }}>No perfect matches found based on your profile.</p>
                    </div>
                  ) : (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '24px' }}>
                      {eligibleSchemes.map((scheme, idx) => renderSchemeCard(scheme, true, idx))}
                    </div>
                  )}
                </div>

                <div>
                  <h3 className="mb-4 flex items-center gap-2" style={{ color: 'var(--primary)' }}>
                    <i data-lucide="library" style={{ width: 24, height: 24 }}></i>
                    All Government Schemes ({allSchemes.length})
                  </h3>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '24px' }}>
                    {allSchemes.map((scheme, idx) => renderSchemeCard(scheme, false, idx))}
                  </div>
                </div>
              </div>
            </div>

            {selectedScheme && (
              <div className="modal-overlay" onClick={() => setSelectedScheme(null)}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                  <button className="modal-close" onClick={() => setSelectedScheme(null)}>
                    <i data-lucide="x" style={{ width: 24, height: 24 }}></i>
                  </button>
                  <h2 style={{ paddingRight: '32px', marginBottom: '8px' }}>{selectedScheme.scheme_name}</h2>
                  <div className="flex gap-2 mb-4 flex-wrap">
                    {selectedScheme.category && <span className="badge badge-primary">{selectedScheme.category}</span>}
                    {selectedScheme.loan_type && <span className="badge badge-primary">{selectedScheme.loan_type}</span>}
                    {selectedScheme.max_project_cost > 0 && <span className="badge badge-primary">Up to ₹{selectedScheme.max_project_cost / 100000} Lakhs</span>}
                    {selectedScheme.interest_rate_pa && <span className="badge badge-primary">{selectedScheme.interest_rate_pa}% p.a.</span>}
                  </div>

                  <div className="detail-section">
                    <h4><i data-lucide="clipboard-list" style={{ width: 18, height: 18 }}></i> Eligibility Criteria</h4>
                    <p style={{ color: 'var(--text-muted)' }}>{selectedScheme.eligibility_criteria}</p>
                  </div>

                  <div className="detail-section">
                    <h4><i data-lucide="trending-up" style={{ width: 18, height: 18, color: 'var(--success)' }}></i> Benefits</h4>
                    <p style={{ color: 'var(--text-muted)' }}>{selectedScheme.benefits_summary}</p>
                  </div>

                  <div className="detail-section" style={{ background: 'rgba(99, 102, 241, 0.05)', padding: '16px', borderRadius: '8px', border: '1px dashed var(--primary)' }}>
                    <h4><i data-lucide="file-check" style={{ width: 18, height: 18, color: 'var(--primary)' }}></i> Documents Required (Things to Carry)</h4>
                    <p style={{ color: 'var(--text-muted)', margin: '8px 0 0 0', fontSize: '0.9rem' }}>
                      {selectedScheme.required_documents}
                    </p>
                  </div>

                  <div style={{ marginTop: '32px', borderTop: '1px solid var(--border)', paddingTop: '24px' }}>
                    <a href={selectedScheme.apply_link || '#'} target="_blank" className="btn btn-primary" style={{ width: '100%', textDecoration: 'none' }}>
                      Apply Now on Official Portal <i data-lucide="external-link" style={{ width: 18, height: 18 }}></i>
                    </a>
                  </div>
                </div>
              </div>
            )}
          </>
        );
      };

      const LoanCalculator = () => {
        const [amount, setAmount] = useState(100000);
        const [rate, setRate] = useState(6.5); // Concessional rate
        const [tenure, setTenure] = useState(60); // Months
        const [emi, setEmi] = useState(0);

        useEffect(() => {
          // EMI Formula: E = P x R x (1+R)^N / [(1+R)^N-1]
          const p = parseFloat(amount);
          const r = parseFloat(rate) / 12 / 100;
          const n = parseFloat(tenure);

          if (p && r && n) {
            const e = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            setEmi(e.toFixed(2));
          } else {
            setEmi(0);
          }
        }, [amount, rate, tenure]);

        return (
          <div className="container animate-fade-in" style={{ paddingTop: '40px', maxWidth: '800px' }}>
            <h2 className="flex items-center gap-2 m-0" style={{ marginBottom: '12px' }}>
              <i data-lucide="calculator" style={{ color: "var(--secondary)" }}></i>
              Financial Calculator
            </h2>
            <p style={{ color: 'var(--text-muted)', marginBottom: '32px' }}>Calculate projected EMIs accounting for specific scheme guidelines (e.g. concessional rates 6.5% - 8%).</p>

            <div className="glass-card grid grid-cols-2 gap-4">
              <div>
                <div className="input-group">
                  <label>Loan Amount (₹)</label>
                  <input type="number" className="chat-input" value={amount} onChange={e => setAmount(e.target.value)} />
                </div>
                <div className="input-group">
                  <label>Interest Rate (%) - *Concessional*</label>
                  <input type="number" step="0.1" className="chat-input" value={rate} onChange={e => setRate(e.target.value)} />
                </div>
                <div className="input-group">
                  <label>Tenure (Months)</label>
                  <input type="number" className="chat-input" value={tenure} onChange={e => setTenure(e.target.value)} />
                </div>
              </div>

              <div className="glass flex flex-col justify-center items-center" style={{ padding: '24px', borderRadius: '12px', background: 'rgba(99, 102, 241, 0.1)' }}>
                <h3 style={{ color: 'var(--text-muted)', marginBottom: '8px' }}>Estimated Monthly EMI</h3>
                <h1 className="text-gradient" style={{ fontSize: '3rem' }}>₹{emi}</h1>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '16px' }}>Total Amount Payable: ₹{(emi * tenure).toFixed(2)}</p>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Total Interest: ₹{((emi * tenure) - amount).toFixed(2)}</p>
              </div>
            </div>
          </div>
        );
      };

      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 0.5 - Math.cos(dLat) / 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * (1 - Math.cos(dLon)) / 2;
        return R * 2 * Math.asin(Math.sqrt(a));
      };

      const LeafletMap = ({ userLoc, partners }) => {
        const mapRef = useRef(null);

        useEffect(() => {
          if (!window.L || !mapRef.current || !userLoc) return;

          // Clear previous map if exists
          if (mapRef.current._leaflet_id) {
            mapRef.current.innerHTML = "";
            mapRef.current._leaflet_id = null;
          }

          const map = window.L.map(mapRef.current).setView([userLoc.lat, userLoc.lng], 5);

          // OpenStreetMap Tile Layer
          window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: ', OpenStreetMap contributors'
          }).addTo(map);

          // User Marker
          const userIcon = window.L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          });
          window.L.marker([userLoc.lat, userLoc.lng], { icon: userIcon }).addTo(map)
            .bindPopup("<b>Your Location</b>").openPopup();

          // Partner Markers
          const partnerIcon = window.L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          });

          partners.forEach(p => {
            if (p.lat && p.lng) {
              const popupHtml = `
              <div style="font-family: inherit;">
                <strong>${p.name}</strong><br/>
                <small style="color: #666;">${p.type} • ${p.distance} away</small><br/>

              </div>
            `;
              window.L.marker([p.lat, p.lng], { icon: partnerIcon }).addTo(map)
                .bindPopup(popupHtml);
            }
          });

          if (partners.length > 0) {
            const bounds = window.L.latLngBounds([userLoc.lat, userLoc.lng]);
            partners.forEach(p => {
              if (p.lat && p.lng) bounds.extend([p.lat, p.lng]);
            });
            map.fitBounds(bounds, { padding: [50, 50] });
          }

          return () => map.remove();
        }, [userLoc, partners]);

        return <div ref={mapRef} style={{ width: '100%', minHeight: '350px', height: '100%', zIndex: 0 }} />;
      };

      const PartnerLocator = () => {
        const [allPartners, setAllPartners] = useState([]);
        const [displayedPartners, setDisplayedPartners] = useState([]);
        const [userLoc, setUserLoc] = useState(null);
        const [locating, setLocating] = useState(false);
        const [locatingMessage, setLocatingMessage] = useState("");

        useEffect(() => {
          supabase.from('channel_partners').select('*').then(({ data }) => setAllPartners(data || []));
        }, []);

        const handleLocate = () => {
          setLocating(true);
          setLocatingMessage("Acquiring GPS coordinates...");

          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (position) => {
              let { latitude, longitude } = position.coords;

              // Constrain demo to West Bengal (as data is WB-only)
              const isInsideWB = latitude >= 21.0 && latitude <= 27.5 && longitude >= 85.5 && longitude <= 90.0;
              if (!isInsideWB) {
                latitude = 22.5726; // Default to Kolkata
                longitude = 88.3639;
              }
              setUserLoc({ lat: latitude, lng: longitude });

              let currentRadius = 20;
              const maxRadius = 100;
              let foundPartners = [];

              while (currentRadius <= maxRadius && foundPartners.length === 0) {
                setLocatingMessage(`Scanning ${currentRadius}km radius...`);
                await new Promise(resolve => setTimeout(resolve, 800)); // UI animation delay

                const calculatedPartners = allPartners.map(p => {
                  const distance = calculateDistance(latitude, longitude, p.latitude, p.longitude);
                  return {
                    name: p.partner_name,
                    type: p.partner_type,
                    status: p.is_fund_eligible ? 'Optimal' : 'Depleted',
                    lat: p.latitude,
                    lng: p.longitude,
                    distance: distance.toFixed(1) + ' km',
                    rawDistance: distance,
                    address: p.address,
                    district: p.district,
                    state: p.state,
                    pincode: p.pincode,
                    contact_number: p.contact_number,
                    email: p.email,
                    supported_scheme_categories: p.supported_scheme_categories,
                    npa_percentage: p.npa_percentage,
                    available_disbursement_limit: p.available_disbursement_limit,
                    is_fund_eligible: p.is_fund_eligible
                  };
                });

                foundPartners = calculatedPartners
                  .filter(p => p.rawDistance <= currentRadius)
                  .sort((a, b) => a.rawDistance - b.rawDistance);

                if (foundPartners.length > 0) {
                  break;
                }

                if (currentRadius < maxRadius) {
                  setLocatingMessage(`No partners found. Expanding search to ${currentRadius + 20}km...`);
                  await new Promise(resolve => setTimeout(resolve, 1000));
                  currentRadius += 20;
                } else {
                  break;
                }
              }

              if (foundPartners.length > 0) {
                setLocatingMessage("Found nearest partners!");
              } else {
                setLocatingMessage("No partners found within 100km.");
              }
              await new Promise(resolve => setTimeout(resolve, 800));

              setLocating(false);
              setLocatingMessage("");

              setDisplayedPartners(foundPartners.slice(0, 6)); // Show top 6 closest
            }, (err) => {
              console.error(err);
              alert("Location access denied or failed. Please allow location access.");
              setLocating(false);
              setLocatingMessage("");
            });
          } else {
            alert("Geolocation is not supported by your browser.");
            setLocating(false);
            setLocatingMessage("");
          }
        };

          if (window.lucide) window.lucide.createIcons();

              </div>

                <i data-lucide={locating ? "loader" : "navigation"} className={locating ? "spin" : ""} style={{ width: 18, height: 18 }}></i>
                {locating ? 'Locating...' : 'Locate Me'}

            </div>

            <div className="grid grid-cols-2 gap-4" style={{ alignItems: 'start' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', position: 'sticky', top: '90px', zIndex: 10 }}>
                <div className="glass-card" style={{ height: '350px', width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0, overflow: 'hidden' }}>
                  {userLoc && !locating ? (
                    <LeafletMap userLoc={userLoc} partners={displayedPartners} />
                  ) : locating ? (
                    <div style={{ textAlign: 'center', padding: '20px' }} className="animate-fade-in">
                      <i data-lucide="loader" className="spin" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px', display: 'block' }}></i>
                      <p style={{ color: 'var(--primary)', fontWeight: 'bold', fontSize: '1.1rem' }}>{locatingMessage}</p>
                    </div>
                  ) : (
                    <div style={{ textAlign: 'center', padding: '20px' }}>
                      <i data-lucide="map" style={{ width: 48, height: 48, color: 'var(--text-muted)', margin: '0 auto 16px', display: 'block' }}></i>
                      <p style={{ color: 'var(--text-muted)' }}>Click "Locate Me" to view the live interactive map.</p>
                    </div>
                  )}
                </div>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.8rem', textAlign: 'center', margin: '4px 0' }}>
                  <i data-lucide="info" style={{ width: 12, height: 12, display: 'inline', marginRight: '4px' }}></i>

                      <div>

                      <strong style={{ color: 'var(--text-color)', display: 'block', marginBottom: 4 }}><i data-lucide="bar-chart-2" style={{ width: 14, height: 14, display: 'inline', verticalAlign: 'middle', marginRight: 4 }}></i>Performance Metrics:</strong>
                      <div className="flex justify-between">

        const handleSend = () => {
          if (!input.trim()) return;

          const userMsg = input;
          setInput('');
          setChatHistory(prev => [...prev, { role: 'user', text: userMsg }]);
          setIsLoading(true);

          setTimeout(() => {
            let aiResponse = "I'm not quite sure I understand. Could you provide more details like your category (e.g., SC/ST/OBC/Women), your project cost, or the type of business you want to start?";
            const lowerInput = userMsg.toLowerCase();

            if (/^(hi|hello|hey|greetings|start)/.test(lowerInput) && lowerInput.length < 15) {
              aiResponse = "Hello there! Tell me a bit about your background (e.g., SC, ST, OBC, Women) and what kind of financial assistance or loan you are looking for.";
            } else {
              const words = lowerInput.match(/\b(\w+)\b/g) || [];
              const stopWords = ['a', 'an', 'the', 'and', 'or', 'is', 'for', 'to', 'of', 'in', 'i', 'want', 'need', 'looking', 'scheme', 'loan', 'business', 'start', 'help', 'me', 'my', 'can', 'you', 'tell', 'about', 'what', 'how', 'do', 'get', 'any'];
              const keywords = words.filter(w => !stopWords.includes(w) && w.length > 2);

              if (keywords.length > 0 && schemesDb.length > 0) {
                const scored = schemesDb.map(s => {
                  let score = 0;
                  const textToSearch = `${s.name} ${s.description} ${s.tags?.join(' ')} ${s.target_category} ${s.loan_type} ${s.criteria}`.toLowerCase();
                  keywords.forEach(kw => {
                    if (textToSearch.includes(kw)) score += 2;
                    // Partial match
                    else if (textToSearch.indexOf(kw) !== -1) score += 1;
                  });
                  return { scheme: s, score };
                }).filter(s => s.score > 0).sort((a, b) => b.score - a.score);

                if (scored.length > 0) {
                  const top = scored[0].scheme;

                  if (lowerInput.includes('benefit') || lowerInput.includes('interest') || lowerInput.includes('rate')) {

                  } else {
                    aiResponse = `Based on your query, the **${top.name}** looks like a great match!\n\n**Overview:** ${top.description}\n**Eligibility:** ${top.criteria || top.target_category}\n\nWould you like to know more about its interest rates or required documents?`;
                  }

                } else {
                  aiResponse = "Sorry, your criteria doesn't match any required eligibility for the schemes in our database. Please try adjusting your details or asking about something else.";
                }
              } else {
                aiResponse = "Sorry, your criteria doesn't match any required eligibility for the schemes in our database. Please try adjusting your details or asking about something else.";
              }
            }

            setChatHistory(prev => [...prev, { role: 'model', text: aiResponse }]);
            setIsLoading(false);
          }, 800 + Math.random() * 800);

        useEffect(() => {

                <h2 className="flex items-center gap-2 m-0"><i data-lucide="bot" style={{ color: '#f59e0b', width: 28, height: 28 }}></i> Sahāy Smart Assistant</h2>

      const MouseTrail = () => {
        useEffect(() => {
          const container = document.createElement('div');
          container.style.position = 'fixed';
          container.style.top = '0';
          container.style.left = '0';
          container.style.width = '100vw';
          container.style.height = '100vh';
          container.style.pointerEvents = 'none';
          container.style.zIndex = '99999';
          container.style.overflow = 'hidden';
          document.body.appendChild(container);

          let lastTime = 0;
          let lastX = null;
          let lastY = null;

          const createBubble = (x, y) => {
            const now = Date.now();
            if (now - lastTime < 30) return;
            lastTime = now;

            // Calculate movement direction
            if (lastX === null) { lastX = x; lastY = y; }
            const dx = x - lastX;
            const dy = y - lastY;
            lastX = x;
            lastY = y;

            // If no movement, don't generate a direction
            if (dx === 0 && dy === 0) return;

            const spark = document.createElement('div');
            const size = Math.random() * 4 + 2;

            spark.style.position = 'absolute';
            spark.style.left = `${x}px`;
            spark.style.top = `${y}px`;
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.borderRadius = '50%';

            const colors = ['#3b82f6', '#60a5fa', '#93c5fd', '#818cf8'];
            spark.style.background = colors[Math.floor(Math.random() * colors.length)];
            spark.style.boxShadow = `0 0 6px ${spark.style.background}`;

            // Calculate trajectory based on mouse movement (shoot backwards like a tail)
            const baseAngle = Math.atan2(-dy, -dx);
            const spread = (Math.random() - 0.5) * (Math.PI / 2); // 90 degree total spread cone
            const angle = baseAngle + spread;
            const distance = Math.random() * 60 + 20;
            const rotation = angle * (180 / Math.PI);

            spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(0px) scale(1)`;
            spark.style.transition = 'all 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            spark.style.opacity = '1';

            container.appendChild(spark);

            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                spark.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) translateX(${distance}px) scale(0)`;
                spark.style.opacity = '0';
              });
            });

            setTimeout(() => {
              if (container.contains(spark)) container.removeChild(spark);
            }, 1000);
          };

          const handleMouseMove = (e) => createBubble(e.clientX, e.clientY);
          const handleTouchMove = (e) => {
            if (e.touches.length > 0) {
              createBubble(e.touches[0].clientX, e.touches[0].clientY);
            }
          };

          window.addEventListener('mousemove', handleMouseMove, { passive: true });
          window.addEventListener('touchmove', handleTouchMove, { passive: true });

          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('touchmove', handleTouchMove);
            if (document.body.contains(container)) document.body.removeChild(container);
          };
        }, []);

        return null;
      };

      const App = () => {

        const [theme, setTheme] = useState(() => localStorage.getItem('sahay_theme') || 'light');

        useEffect(() => {
          if (theme === 'dark') {
            document.body.classList.add('dark-theme');
          } else {
            document.body.classList.remove('dark-theme');
          }
          localStorage.setItem('sahay_theme', theme);
        }, [theme]);

        const toggleTheme = () => {
          setTheme(prev => (prev === 'light' ? 'dark' : 'light'));
        };

        const getInitialState = (key, defaultValue) => {
          const saved = localStorage.getItem(key);
          if (saved) {
            try {
              return JSON.parse(saved);
            } catch (e) {
              return defaultValue;
            }
          }
          return defaultValue;
        };

        const [currentView, setView] = useState(() => getInitialState('sahay_currentView', 'home'));
        const [session, setSession] = useState(null);
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [isSignUpMode, setIsSignUpMode] = useState(false);
        const [formData, setFormData] = useState(() => getInitialState('sahay_formData', {
          name: '',
          phone: '',
          isVerified: false,
          age: '',
          gender: 'Male',
          category: 'SC',
          loanType: 'Business Loan',
          income: '',
          cost: ''
        }));

        useEffect(() => {
          localStorage.setItem('sahay_currentView', JSON.stringify(currentView));
        }, [currentView]);

        useEffect(() => {
          localStorage.setItem('sahay_formData', JSON.stringify(formData));
        }, [formData]);

        const [showRecoveryModal, setShowRecoveryModal] = useState(false);

        useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => {
            setSession(session);
          });

          const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
            setSession(session);
            if (event === 'PASSWORD_RECOVERY') {
              setShowRecoveryModal(true);
            }
          });

          return () => subscription.unsubscribe();
        }, []);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [currentView, formData, showAuthModal, session]);

        const handleProtectedView = (viewName) => {
          if (!session && viewName !== 'home') {
            setIsSignUpMode(false);
            setShowAuthModal(true);
          } else {
            setView(viewName);
          }
        };

        return (
          <>
            <MouseTrail />
            <Navbar currentView={currentView} setView={handleProtectedView} session={session} onAuthClick={(isSignUp) => { setIsSignUpMode(isSignUp); setShowAuthModal(true); }} formData={formData} theme={theme} toggleTheme={toggleTheme} />
            <main>
              {!session ? (
                <LandingPage onAuthClick={(isSignUp) => { setIsSignUpMode(isSignUp); setShowAuthModal(true); }} setView={handleProtectedView} />
              ) : (
                <>
                  {currentView === 'home' && <Home setView={handleProtectedView} />}
                  {currentView === 'wizard' && <Wizard setView={handleProtectedView} formData={formData} setFormData={setFormData} session={session} />}
                  {currentView === 'schemes' && <Schemes setView={handleProtectedView} formData={formData} session={session} />}
                  {currentView === 'calculator' && <LoanCalculator />}
                  {currentView === 'locator' && <PartnerLocator />}
                  {currentView === 'ai-mentor' && <AiMentor setView={handleProtectedView} />}
                  {!['home', 'wizard', 'schemes', 'calculator', 'locator', 'ai-mentor'].includes(currentView) && <Home setView={handleProtectedView} />}
                </>
              )}
            </main>

            {showAuthModal && (
              <AuthModal
                onClose={() => setShowAuthModal(false)}
                onLoginSuccess={(session) => {
                  setShowAuthModal(false);
                }}
                initialSignUp={isSignUpMode}
              />
            )}


            {showRecoveryModal && (
              <RecoveryModal onClose={() => setShowRecoveryModal(false)} />
            )}
          </>
        );
      };

      const RecoveryModal = ({ onClose }) => {
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [message, setMessage] = useState('');

        const handleReset = async () => {
          setLoading(true);
          setError('');
          setMessage('');
          const { error } = await supabase.auth.updateUser({ password });
          if (error) {
            setError(error.message);
          } else {
            setMessage('Password updated successfully! You can now use your new password.');
            setTimeout(() => {
              onClose();
            }, 3000);
          }
          setLoading(false);
        };

        return (
          <div className="modal-overlay animate-fade-in" style={{ zIndex: 99999, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div className="modal-content glass" style={{ maxWidth: '400px', width: '90%', padding: '32px', textAlign: 'center', borderRadius: '24px' }}>
              <i data-lucide="key" style={{ width: 48, height: 48, color: 'var(--primary)', margin: '0 auto 16px' }}></i>
              <h2 style={{ marginBottom: '12px' }}>Set New Password</h2>
              <p style={{ color: 'var(--text-muted)', marginBottom: '24px', fontSize: '0.95rem' }}>Enter your new password below.</p>
              
              {error && <div style={{ color: '#ef4444', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}
              {message && <div style={{ color: 'var(--success)', marginBottom: '16px', fontSize: '0.9rem' }}>{message}</div>}

              <input type="password" className="chat-input" placeholder="New Password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', marginBottom: '16px' }} />
              
              <button className="btn btn-primary" onClick={handleReset} style={{ width: '100%', padding: '12px', borderRadius: '12px' }} disabled={loading}>
                {loading ? 'Updating...' : 'Update Password'}
              </button>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);

  </script>
</body>

</html>
